# Docker Compose для Northflank.com
# Оптимизирован для production deployment

version: '3.8'

services:
  telegram-gemini-bot:
    build:
      context: .
      dockerfile: ./Dockerfile.northflank
    container_name: gemaibotv2-northflank
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=10000
      - LOG_JSON=true
      - ENABLE_PERSISTENT_QUEUE=true
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "10000:10000"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge
