apiVersion: 1

deleteDatasources:
  - name: GemAI Bot Logs
    orgId: 1

datasources:
  - name: GemAI Bot Logs
    uid: gemaibot-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    timeout: 10
    jsonData:
      maxLines: 100
      timeout: 10
      derivedFields:
        - name: request_id
          matcherRegex: '"request_id":"([a-f0-9]{32})"'
          url: '/explore?left={"datasource":"gemaibot-loki","queries":[{"refId":"A","expr":"{service_name=\\"gemaibotv2\\"} | json | request_id=\\"${__value.raw}\\""}],"range":{"from":"now-15m","to":"now"}}'
          urlDisplayLabel: Find this request
        - name: trace_id
          matcherRegex: '"trace_id":"([a-f0-9]{32})"'
          url: '/explore?left={"datasource":"gemaibot-loki","queries":[{"refId":"A","expr":"{service_name=\\"gemaibotv2\\"} | json | trace_id=\\"${__value.raw}\\""}],"range":{"from":"now-15m","to":"now"}}'
          urlDisplayLabel: Find this trace
