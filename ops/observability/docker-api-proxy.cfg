global
    log stdout format raw local0
    maxconn 32

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 65s
    timeout server 65s
    timeout tunnel 1h

frontend docker_api
    bind :2375

    acl method_read method GET HEAD
    acl allowed_path path_reg -i ^(/v[0-9.]+)?/_ping$
    acl allowed_path path_reg -i ^(/v[0-9.]+)?/version$
    acl allowed_path path_reg -i ^(/v[0-9.]+)?/events$
    acl allowed_path path_reg -i ^(/v[0-9.]+)?/containers/json$
    acl allowed_path path_reg -i ^(/v[0-9.]+)?/containers/[0-9a-f]{12,64}/json$
    acl allowed_path path_reg -i ^(/v[0-9.]+)?/containers/[0-9a-f]{12,64}/logs$

    http-request deny unless method_read allowed_path
    default_backend docker_socket

backend docker_socket
    server docker /var/run/docker.sock
