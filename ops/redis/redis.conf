bind 0.0.0.0
protected-mode yes
port 6379
aclfile /usr/local/etc/redis/users.acl
dir /data
dbfilename dump.rdb
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
save ""
maxmemory 256mb
maxmemory-policy noeviction
maxclients 256
timeout 0
tcp-keepalive 60
databases 16
loglevel notice
