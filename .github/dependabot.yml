version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "cron"
      # Fugit's weekday modulo preserves exact fortnightly gaps across months.
      # https://github.com/dependabot/dependabot-core/issues/12246
      cronjob: "0 8 * * mon%2"
      timezone: "UTC"
    cooldown:
      default-days: 7
    versioning-strategy: increase-if-necessary
    rebase-strategy: auto
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    groups:
      safe-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        # Dependabot follows SemVer mechanically. Keep every current 0.x direct
        # dependency out of this group because its minor bump is breaking-risk.
        exclude-patterns:
          - "asyncpg"
          - "httpx"
          - "hypercorn"
          - "quart"
          - "ruff"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 8 * * mon%2"
      timezone: "UTC"
    cooldown:
      default-days: 7
    rebase-strategy: auto
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(docker)"
