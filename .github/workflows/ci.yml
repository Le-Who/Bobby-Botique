name: CI — Lint & Test

on:
  push:
    branches: [main, TEST_gemaibotv2]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff>=0.11.0,<1.0.0

      - name: Check formatting
        run: ruff format --check .

      - name: Check linting rules
        run: ruff check . --output-format=github

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          TELEGRAM_BOT_TOKEN: "0000000000:AAFake-Token-For-CI-Tests-Only"
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          ADMIN_ID: "1"
          GEMINI_API_KEYS: "fake-key-for-ci"
          TAVILY_API_KEYS: "fake-key-for-ci"
          ADMIN_SECRET: "ci-test-secret-key-32chars-long!!"
        run: python -m pytest tests/ -x -q --tb=short

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f Dockerfile.northflank -t gemaibotv2:ci .
