name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff>=0.11.0,<1.0.0

      - name: Check formatting
        run: ruff format --check .

      - name: Check linting rules
        run: ruff check .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          # Minimal env vars for test suite (no real DB/API connections needed)
          TELEGRAM_BOT_TOKEN: "0000000000:AAFake-Token-For-CI-Tests-Only"
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          ADMIN_ID: "1"
          GEMINI_API_KEYS: "fake-key-for-ci"
          TAVILY_API_KEYS: "fake-key-for-ci"
        run: python -m pytest tests/ -v --tb=short -q

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f Dockerfile.northflank -t gemaibotv2:ci .
