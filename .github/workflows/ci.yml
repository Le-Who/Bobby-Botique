name: CI

on:
  push:
    branches: [vps_testai, main, TEST_gemaibotv2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Format (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned uv
        run: python -m pip install "uv==0.12.6"
      - name: Sync locked dependencies
        run: uv sync --locked --link-mode copy
      - name: Ruff check
        run: uv run --locked ruff check . --output-format=github
      - name: Ruff format check
        run: uv run --locked ruff format --check .

  type-check:
    name: Type Check (Mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned uv
        run: python -m pip install "uv==0.12.6"
      - name: Sync locked dependencies
        run: uv sync --locked --link-mode copy
      - name: Mypy
        run: uv run --locked mypy app bot.py

  test-unit:
    name: Test Unit and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]
    env:
      TELEGRAM_BOT_TOKEN: "test:token"
      DATABASE_URL: "postgresql://test:test@localhost/test"
      ADMIN_ID: "123456"
      GEMINI_API_KEYS: "test-key"
      TAVILY_API_KEYS: "test-key"
      ADMIN_SECRET: "test-secret"
      REDIS_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned uv
        run: python -m pip install "uv==0.12.6"
      - name: Sync locked dependencies
        run: uv sync --locked --link-mode copy
      - name: Run unit and E2E tests
        run: uv run --locked pytest tests/ --ignore=tests/integration -m "not integration" -v

  test-integration:
    name: Test Integration (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-unit]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TELEGRAM_BOT_TOKEN: "test:token"
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      TEST_DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      GEMAIBOT_TEST_DATABASE_IS_EPHEMERAL: "true"
      ADMIN_ID: "123456"
      GEMINI_API_KEYS: "test-key"
      TAVILY_API_KEYS: "test-key"
      ADMIN_SECRET: "test-secret"
      REDIS_URL: "redis://localhost:6379/0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned uv
        run: python -m pip install "uv==0.12.6"
      - name: Sync locked dependencies
        run: uv sync --locked --link-mode copy
      - name: Require isolated test database
        run: >-
          python -c "import os; assert os.environ.get('TEST_DATABASE_URL'),
          'TEST_DATABASE_URL must be set'"
      - name: Apply migrations
        run: |
          uv run --locked python scripts/migrate.py
          uv run --locked python scripts/migrate.py
          uv run --locked python scripts/migrate.py --check
      - name: Run integration tests serially
        run: uv run --locked pytest -m "integration" -n 0 tests/ -v

  container-smoke:
    name: Build and Smoke Production Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, type-check, test-unit]
    env:
      IMAGE_TAG: gemaibotv2-dependency-smoke:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Build exact production image
        run: docker build --tag "$IMAGE_TAG" .
      - name: Check installed dependency consistency
        run: docker run --rm --network none "$IMAGE_TAG" uv pip check
      - name: Run offline dependency and health smoke
        run: >-
          docker run --rm --network none
          -e TELEGRAM_BOT_TOKEN="123456:test-token"
          -e DATABASE_URL="postgresql://test:test@localhost/test"
          -e ADMIN_ID="123456"
          -e GEMINI_API_KEYS="test-key"
          -e TAVILY_API_KEYS="test-key"
          -e ADMIN_SECRET="test-secret"
          -e REDIS_URL=""
          "$IMAGE_TAG"
          python scripts/dependency_container_smoke.py

  dependency-audit:
    name: Audit Production Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned uv
        run: python -m pip install "uv==0.12.6"
      - name: Sync locked dependencies
        run: uv sync --locked --link-mode copy
      - name: Export exact production graph
        run: |
          mkdir -p .pytest_tmp
          uv export --locked --no-dev --no-hashes --no-header --no-annotate --no-emit-project \
            --output-file .pytest_tmp/production-requirements.txt
      - name: Audit exact production graph
        run: >-
          uv run --locked pip-audit
          -r .pytest_tmp/production-requirements.txt
          --progress-spinner off
      - name: Generate CycloneDX production SBOM
        run: >-
          uv --quiet export --locked --no-dev
          --format cyclonedx1.5
          --output-file .pytest_tmp/sbom.cdx.json
      - name: Generate policy-aware license inventory
        run: >-
          uv run --locked python scripts/dependency_license_inventory.py
          --sbom .pytest_tmp/sbom.cdx.json
          --output .pytest_tmp/licenses.json
      - name: Upload production dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-dependency-evidence-${{ github.sha }}
          path: |
            .pytest_tmp/production-requirements.txt
            .pytest_tmp/sbom.cdx.json
            .pytest_tmp/licenses.json
          if-no-files-found: error
          retention-days: 30
