name: CI

on:
  push:
    branches: [vps_testai, main, TEST_gemaibotv2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Format (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Set up pinned uv with dependency cache
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies
        run: uv sync --locked --link-mode copy
      - name: Documentation encoding integrity
        run: uv run --locked python scripts/check_encoding.py
      - name: Current documentation links
        run: uv run --locked python scripts/check_docs_links.py
      - name: Environment source inventory
        run: uv run --locked python scripts/check_env_registry.py
      - name: Ruff check
        run: uv run --locked ruff check . --output-format=github
      - name: Ruff format check
        run: uv run --locked ruff format --check .

  type-check:
    name: Type Check (Mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Set up pinned uv with dependency cache
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies
        run: uv sync --locked --link-mode copy
      - name: Mypy
        run: uv run --locked mypy app bot.py

  test-unit:
    name: Test Unit and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: "test:token"
      DATABASE_URL: "postgresql://test:test@localhost/test"
      ADMIN_ID: "123456"
      GEMINI_API_KEYS: "test-key"
      TAVILY_API_KEYS: "test-key"
      ADMIN_SECRET: "test-secret"
      REDIS_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Set up pinned uv with dependency cache
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies
        run: uv sync --locked --link-mode copy
      - name: Run unit and E2E tests
        run: uv run --locked pytest tests/ --ignore=tests/integration -m "not integration and not browser" -v

  test-integration:
    name: Test Integration (PostgreSQL and Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TELEGRAM_BOT_TOKEN: "test:token"
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      TEST_DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      GEMAIBOT_TEST_DATABASE_IS_EPHEMERAL: "true"
      ADMIN_ID: "123456"
      GEMINI_API_KEYS: "test-key"
      TAVILY_API_KEYS: "test-key"
      ADMIN_SECRET: "test-secret"
      REDIS_URL: "redis://localhost:6379/0"
      TEST_REDIS_URL: "redis://localhost:6379/15"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Set up pinned uv with dependency cache
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked dependencies
        run: uv sync --locked --link-mode copy
      - name: Require isolated test services
        run: >-
          python -c "import os; assert os.environ.get('TEST_DATABASE_URL'),
          'TEST_DATABASE_URL must be set';
          assert os.environ.get('TEST_REDIS_URL'), 'TEST_REDIS_URL must be set'"
      - name: Apply migrations
        run: |
          uv run --locked python scripts/migrate.py
          uv run --locked python scripts/migrate.py
          uv run --locked python scripts/migrate.py --check
      - name: Run integration tests serially
        run: uv run --locked pytest -m "integration" -n 0 tests/ -v

  test-browser:
    name: Test Browser (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMAIBOT_REQUIRE_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Set up pinned uv with dependency cache
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked Python dependencies
        run: uv sync --locked --link-mode copy
      - name: Install locked browser dependencies
        working-directory: tests/browser
        run: npm ci --ignore-scripts
      - name: Install Chromium and system dependencies
        working-directory: tests/browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Run required browser regressions
        run: >-
          uv run --locked pytest tests/ -m browser -n 0
          --override-ini="addopts=" --timeout=30 -v

  container-smoke:
    name: Build and Smoke Production Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_TAG: gemaibotv2-dependency-smoke:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build exact production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,scope=production,mode=max,ignore-error=true
      - name: Check installed dependency consistency
        run: docker run --rm --network none "$IMAGE_TAG" uv pip check
      - name: Run offline dependency and health smoke
        run: >-
          docker run --rm --network none
          -e TELEGRAM_BOT_TOKEN="123456:test-token"
          -e DATABASE_URL="postgresql://test:test@localhost/test"
          -e ADMIN_ID="123456"
          -e GEMINI_API_KEYS="test-key"
          -e TAVILY_API_KEYS="test-key"
          -e ADMIN_SECRET="test-secret"
          -e REDIS_URL=""
          "$IMAGE_TAG"
          python scripts/dependency_container_smoke.py
