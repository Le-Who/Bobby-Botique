name: CI

on:
  push:
    branches: [main, TEST_gemaibotv2]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check app/ tests/ load_test.py --output-format=github
      - name: Ruff format check
        run: ruff format --check app/ tests/ load_test.py

  type-check:
    name: Type Check (Mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install mypy
      - name: Mypy
        run: mypy app/ tests/ load_test.py

  test-unit:
    name: Test Unit (Fast)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint]
    env:
      TELEGRAM_BOT_TOKEN: "test:token"
      DATABASE_URL: "postgresql://test:test@localhost/test"
      ADMIN_ID: "123456"
      GEMINI_API_KEYS: "test-key"
      TAVILY_API_KEYS: "test-key"
      ADMIN_SECRET: "test-secret"
      REDIS_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run unit tests
        run: pytest tests/ -v
        
  test-integration:
    name: Test Integration (Slow)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-unit]
    env:
      TELEGRAM_BOT_TOKEN: "test:token"
      DATABASE_URL: "postgresql://test:test@localhost/test"
      ADMIN_ID: "123456"
      GEMINI_API_KEYS: "test-key"
      TAVILY_API_KEYS: "test-key"
      ADMIN_SECRET: "test-secret"
      REDIS_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run integration tests
        run: pytest -m "integration" -n auto tests/ -v
