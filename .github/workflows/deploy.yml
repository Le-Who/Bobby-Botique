name: Deploy Telegram Bot

on:
  push:
    branches:
      - vps_testai

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.northflank
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO }}:latest

      - name: Deploy to DigitalOcean VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ env.REPO }}
          REGISTRY: ${{ env.REGISTRY }}
          # --- CORE ---
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBAPP_BASE_URL: ${{ secrets.WEBAPP_BASE_URL }}
          PORT: ${{ secrets.PORT }}
          ENABLE_WEB_SERVER: ${{ secrets.ENABLE_WEB_SERVER }}
          # --- GEMINI MODELS ---
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_AVAILABLE_MODELS: ${{ secrets.GEMINI_AVAILABLE_MODELS }}
          DEFAULT_MODEL: ${{ secrets.DEFAULT_MODEL }}
          QNA_MODEL: ${{ secrets.QNA_MODEL }}
          RESEARCH_MODEL: ${{ secrets.RESEARCH_MODEL }}
          URL_SELECTION_MODEL: ${{ secrets.URL_SELECTION_MODEL }}
          TAXONOMY_MODEL: ${{ secrets.TAXONOMY_MODEL }}
          # --- OPENROUTER MODELS ---
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          USE_OPENROUTER: ${{ secrets.USE_OPENROUTER }}
          OPENROUTER_AVAILABLE_MODELS: ${{ secrets.OPENROUTER_AVAILABLE_MODELS }}
          OPENROUTER_DEFAULT_MODEL: ${{ secrets.OPENROUTER_DEFAULT_MODEL }}
          OPENROUTER_QNA_MODEL: ${{ secrets.OPENROUTER_QNA_MODEL }}
          OPENROUTER_RESEARCH_MODEL: ${{ secrets.OPENROUTER_RESEARCH_MODEL }}
          OPENROUTER_URL_SELECTION_MODEL: ${{ secrets.OPENROUTER_URL_SELECTION_MODEL }}
          # --- SEARCH ---
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          # --- RATE LIMITS & CONCURRENCY ---
          DAILY_LIMITS: ${{ secrets.DAILY_LIMITS }}
          MAX_CONCURRENT_HEAVY_REQUESTS: ${{ secrets.MAX_CONCURRENT_HEAVY_REQUESTS }}
          MAX_CONCURRENT_ULTRA_HEAVY_REQUESTS: ${{ secrets.MAX_CONCURRENT_ULTRA_HEAVY_REQUESTS }}
          LRU_STATE_CACHE_SIZE: ${{ secrets.LRU_STATE_CACHE_SIZE }}
          DB_POOL_MIN_SIZE: ${{ secrets.DB_POOL_MIN_SIZE }}
          DB_POOL_MAX_SIZE: ${{ secrets.DB_POOL_MAX_SIZE }}
          # --- AGENTIC RESEARCH ---
          AGENTIC_MODEL: ${{ secrets.AGENTIC_MODEL }}
          AGENTIC_MAX_TOKENS: ${{ secrets.AGENTIC_MAX_TOKENS }}
          AGENTIC_TIMEOUT_SECONDS: ${{ secrets.AGENTIC_TIMEOUT_SECONDS }}
          AGENTIC_MAX_ITERATIONS: ${{ secrets.AGENTIC_MAX_ITERATIONS }}
          AGENTIC_MAX_PAGES: ${{ secrets.AGENTIC_MAX_PAGES }}
          AGENTIC_PAGE_CONTENT_LIMIT: ${{ secrets.AGENTIC_PAGE_CONTENT_LIMIT }}
          ADAPTIVE_THINKING_ENABLED: ${{ secrets.ADAPTIVE_THINKING_ENABLED }}
          # --- IMAGE GENERATION ---
          IMAGE_MODELS: ${{ secrets.IMAGE_MODELS }}
          DEFAULT_IMAGE_MODEL: ${{ secrets.DEFAULT_IMAGE_MODEL }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          IMAGE_GEN_DAILY_LIMIT: ${{ secrets.IMAGE_GEN_DAILY_LIMIT }}
          IMAGE_GEN_RPD_PER_KEY: ${{ secrets.IMAGE_GEN_RPD_PER_KEY }}
          IMAGE_GEN_TIMEOUT: ${{ secrets.IMAGE_GEN_TIMEOUT }}
          IMAGE_GEN_MAX_RETRIES: ${{ secrets.IMAGE_GEN_MAX_RETRIES }}
          # --- VOICE (TTS) ---
          ELEVENLABS_API_KEYS: ${{ secrets.ELEVENLABS_API_KEYS }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          # --- LOGGING ---
          STRUCTURED_LOGGING: ${{ secrets.STRUCTURED_LOGGING }}
          LOG_PRETTY: ${{ secrets.LOG_PRETTY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Перечисляем ВСЕ переменные через запятую для проброса в SSH
          envs: GITHUB_TOKEN, REPO, REGISTRY, ADMIN_ID, ADMIN_SECRET, TELEGRAM_BOT_TOKEN, DATABASE_URL, REDIS_URL, WEBHOOK_URL, WEBAPP_BASE_URL, PORT, ENABLE_WEB_SERVER, GEMINI_API_KEYS, GEMINI_AVAILABLE_MODELS, DEFAULT_MODEL, QNA_MODEL, RESEARCH_MODEL, URL_SELECTION_MODEL, TAXONOMY_MODEL, OPENROUTER_API_KEYS, USE_OPENROUTER, OPENROUTER_AVAILABLE_MODELS, OPENROUTER_DEFAULT_MODEL, OPENROUTER_QNA_MODEL, OPENROUTER_RESEARCH_MODEL, OPENROUTER_URL_SELECTION_MODEL, TAVILY_API_KEYS, JINA_API_KEY, DAILY_LIMITS, MAX_CONCURRENT_HEAVY_REQUESTS, MAX_CONCURRENT_ULTRA_HEAVY_REQUESTS, LRU_STATE_CACHE_SIZE, DB_POOL_MIN_SIZE, DB_POOL_MAX_SIZE, AGENTIC_MODEL, AGENTIC_MAX_TOKENS, AGENTIC_TIMEOUT_SECONDS, AGENTIC_MAX_ITERATIONS, AGENTIC_MAX_PAGES, AGENTIC_PAGE_CONTENT_LIMIT, ADAPTIVE_THINKING_ENABLED, IMAGE_MODELS, DEFAULT_IMAGE_MODEL, POLLINATIONS_API_KEY, IMAGE_GEN_DAILY_LIMIT, IMAGE_GEN_RPD_PER_KEY, IMAGE_GEN_TIMEOUT, IMAGE_GEN_MAX_RETRIES, ELEVENLABS_API_KEYS, ELEVENLABS_VOICE_ID, STRUCTURED_LOGGING, LOG_PRETTY
          script: |
            echo $GITHUB_TOKEN | docker login $REGISTRY -u ${{ github.actor }} --password-stdin

            docker pull $REGISTRY/$REPO:latest

            docker stop tg-bot || true
            docker rm tg-bot || true

            # Запускаем контейнер с передачей всех переменных
            docker run -d \
              --name tg-bot \
              --restart unless-stopped \
              -p 127.0.0.1:$PORT:$PORT \
              -e ADMIN_ID="$ADMIN_ID" \
              -e ADMIN_SECRET="$ADMIN_SECRET" \
              -e TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
              -e DATABASE_URL="$DATABASE_URL" \
              -e REDIS_URL="$REDIS_URL" \
              -e WEBHOOK_URL="$WEBHOOK_URL" \
              -e WEBAPP_BASE_URL="$WEBAPP_BASE_URL" \
              -e PORT="$PORT" \
              -e ENABLE_WEB_SERVER="$ENABLE_WEB_SERVER" \
              -e GEMINI_API_KEYS="$GEMINI_API_KEYS" \
              -e GEMINI_AVAILABLE_MODELS="$GEMINI_AVAILABLE_MODELS" \
              -e DEFAULT_MODEL="$DEFAULT_MODEL" \
              -e QNA_MODEL="$QNA_MODEL" \
              -e RESEARCH_MODEL="$RESEARCH_MODEL" \
              -e URL_SELECTION_MODEL="$URL_SELECTION_MODEL" \
              -e TAXONOMY_MODEL="$TAXONOMY_MODEL" \
              -e OPENROUTER_API_KEYS="$OPENROUTER_API_KEYS" \
              -e USE_OPENROUTER="$USE_OPENROUTER" \
              -e OPENROUTER_AVAILABLE_MODELS="$OPENROUTER_AVAILABLE_MODELS" \
              -e OPENROUTER_DEFAULT_MODEL="$OPENROUTER_DEFAULT_MODEL" \
              -e OPENROUTER_QNA_MODEL="$OPENROUTER_QNA_MODEL" \
              -e OPENROUTER_RESEARCH_MODEL="$OPENROUTER_RESEARCH_MODEL" \
              -e OPENROUTER_URL_SELECTION_MODEL="$OPENROUTER_URL_SELECTION_MODEL" \
              -e TAVILY_API_KEYS="$TAVILY_API_KEYS" \
              -e JINA_API_KEY="$JINA_API_KEY" \
              -e DAILY_LIMITS="$DAILY_LIMITS" \
              -e MAX_CONCURRENT_HEAVY_REQUESTS="$MAX_CONCURRENT_HEAVY_REQUESTS" \
              -e MAX_CONCURRENT_ULTRA_HEAVY_REQUESTS="$MAX_CONCURRENT_ULTRA_HEAVY_REQUESTS" \
              -e LRU_STATE_CACHE_SIZE="$LRU_STATE_CACHE_SIZE" \
              -e DB_POOL_MIN_SIZE="$DB_POOL_MIN_SIZE" \
              -e DB_POOL_MAX_SIZE="$DB_POOL_MAX_SIZE" \
              -e AGENTIC_MODEL="$AGENTIC_MODEL" \
              -e AGENTIC_MAX_TOKENS="$AGENTIC_MAX_TOKENS" \
              -e AGENTIC_TIMEOUT_SECONDS="$AGENTIC_TIMEOUT_SECONDS" \
              -e AGENTIC_MAX_ITERATIONS="$AGENTIC_MAX_ITERATIONS" \
              -e AGENTIC_MAX_PAGES="$AGENTIC_MAX_PAGES" \
              -e AGENTIC_PAGE_CONTENT_LIMIT="$AGENTIC_PAGE_CONTENT_LIMIT" \
              -e ADAPTIVE_THINKING_ENABLED="$ADAPTIVE_THINKING_ENABLED" \
              -e IMAGE_MODELS="$IMAGE_MODELS" \
              -e DEFAULT_IMAGE_MODEL="$DEFAULT_IMAGE_MODEL" \
              -e POLLINATIONS_API_KEY="$POLLINATIONS_API_KEY" \
              -e IMAGE_GEN_DAILY_LIMIT="$IMAGE_GEN_DAILY_LIMIT" \
              -e IMAGE_GEN_RPD_PER_KEY="$IMAGE_GEN_RPD_PER_KEY" \
              -e IMAGE_GEN_TIMEOUT="$IMAGE_GEN_TIMEOUT" \
              -e IMAGE_GEN_MAX_RETRIES="$IMAGE_GEN_MAX_RETRIES" \
              -e ELEVENLABS_API_KEYS="$ELEVENLABS_API_KEYS" \
              -e ELEVENLABS_VOICE_ID="$ELEVENLABS_VOICE_ID" \
              -e STRUCTURED_LOGGING="$STRUCTURED_LOGGING" \
              -e LOG_PRETTY="$LOG_PRETTY" \
              $REGISTRY/$REPO:latest

            docker image prune -f
