name: Deploy Telegram Bot

on:
  push:
    branches:
      - vps_testai

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build_image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Retry build on transient failure
        if: failure() && steps.build_image.outcome == 'failure'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare secrets for SSH
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          # Base64 encode ADMIN_SECRET to prevent Bash expansion issues in ssh-action
          echo "ADMIN_SECRET_B64=$(echo -n "$ADMIN_SECRET" | base64 -w 0)" >> $GITHUB_ENV

      - name: Deploy to DigitalOcean VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ env.REPO }}
          REGISTRY: ${{ env.REGISTRY }}
          # --- CORE ---
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_SECRET_B64: ${{ env.ADMIN_SECRET_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBAPP_BASE_URL: ${{ secrets.WEBAPP_BASE_URL }}
          MINIAPP_SHORT_NAME: ${{ secrets.MINIAPP_SHORT_NAME }}
          GAME_HUB_URL: ${{ secrets.GAME_HUB_URL }}
          GAME_HUB_DIRECT_LINK: ${{ secrets.GAME_HUB_DIRECT_LINK }}
          GAME_HUB_MINIAPP_SHORT_NAME: ${{ secrets.GAME_HUB_MINIAPP_SHORT_NAME || 'games' }}
          PORT: ${{ secrets.PORT }}
          ENABLE_WEB_SERVER: ${{ secrets.ENABLE_WEB_SERVER }}
          # --- NATAL CHART REPORTS ---
          NATAL_REPORTS_ENABLED: ${{ secrets.NATAL_REPORTS_ENABLED || 'false' }}
          NATAL_REPORT_TTL_DAYS: ${{ secrets.NATAL_REPORT_TTL_DAYS || '365' }}
          NATAL_GEOCODER_PROVIDER: ${{ secrets.NATAL_GEOCODER_PROVIDER || 'local' }}
          NATAL_CITY_OVERRIDES_PATH: ${{ secrets.NATAL_CITY_OVERRIDES_PATH }}
          NATAL_SEND_RAW_BIRTH_DATA_TO_LLM: ${{ secrets.NATAL_SEND_RAW_BIRTH_DATA_TO_LLM || 'false' }}
          # --- LOCAL BOT API SERVER ---
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          # --- GEMINI MODELS ---
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_AVAILABLE_MODELS: ${{ secrets.GEMINI_AVAILABLE_MODELS }}
          DEFAULT_MODEL: ${{ secrets.DEFAULT_MODEL }}
          QNA_MODEL: ${{ secrets.QNA_MODEL }}
          RESEARCH_MODEL: ${{ secrets.RESEARCH_MODEL }}
          URL_SELECTION_MODEL: ${{ secrets.URL_SELECTION_MODEL }}
          TAXONOMY_MODEL: ${{ secrets.TAXONOMY_MODEL }}
          VERTEX_AI_KEY: ${{ secrets.VERTEX_AI_KEY }}
          VERTEX_AI_PROJECT: ${{ secrets.VERTEX_AI_PROJECT }}
          VERTEX_AI_LOCATION: ${{ secrets.VERTEX_AI_LOCATION }}
          VERTEX_LIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.VERTEX_LIVE_SERVICE_ACCOUNT_JSON }}
          # --- OPENCODE GO MODELS (Primary Provider) ---
          OPENCODE_API_KEYS: ${{ secrets.OPENCODE_API_KEYS }}
          PRIMARY_PROVIDER: ${{ secrets.PRIMARY_PROVIDER }}
          OPENCODE_AVAILABLE_MODELS: ${{ secrets.OPENCODE_AVAILABLE_MODELS }}
          OPENCODE_DEFAULT_MODEL: ${{ secrets.OPENCODE_DEFAULT_MODEL }}
          OPENCODE_QNA_MODEL: ${{ secrets.OPENCODE_QNA_MODEL }}
          OPENCODE_RESEARCH_MODEL: ${{ secrets.OPENCODE_RESEARCH_MODEL }}
          OPENCODE_VISION_MODEL: ${{ secrets.OPENCODE_VISION_MODEL }}
          OPENCODE_INLINE_MODEL: ${{ secrets.OPENCODE_INLINE_MODEL }}
          # --- OPENROUTER MODELS (Tertiary Provider) ---
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          USE_OPENROUTER: ${{ secrets.USE_OPENROUTER }}
          OPENROUTER_AVAILABLE_MODELS: ${{ secrets.OPENROUTER_AVAILABLE_MODELS }}
          OPENROUTER_DEFAULT_MODEL: ${{ secrets.OPENROUTER_DEFAULT_MODEL }}
          OPENROUTER_QNA_MODEL: ${{ secrets.OPENROUTER_QNA_MODEL }}
          OPENROUTER_RESEARCH_MODEL: ${{ secrets.OPENROUTER_RESEARCH_MODEL }}
          OPENROUTER_URL_SELECTION_MODEL: ${{ secrets.OPENROUTER_URL_SELECTION_MODEL }}
          # --- FREETHEAI MODELS (Alternative Provider) ---
          FREETHEAI_API_KEYS: ${{ secrets.FREETHEAI_API_KEYS }}
          FREETHEAI_AVAILABLE_MODELS: ${{ secrets.FREETHEAI_AVAILABLE_MODELS }}
          FREETHEAI_DEFAULT_MODEL: ${{ secrets.FREETHEAI_DEFAULT_MODEL }}
          # --- SEARCH ---
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
          # --- RATE LIMITS & CONCURRENCY ---
          DAILY_LIMITS: ${{ secrets.DAILY_LIMITS }}
          MAX_CONCURRENT_HEAVY_REQUESTS: ${{ secrets.MAX_CONCURRENT_HEAVY_REQUESTS }}
          MAX_CONCURRENT_HEAVY_CALLBACKS: ${{ secrets.MAX_CONCURRENT_HEAVY_CALLBACKS }}
          MAX_CONCURRENT_ULTRA_HEAVY_REQUESTS: ${{ secrets.MAX_CONCURRENT_ULTRA_HEAVY_REQUESTS }}
          LRU_STATE_CACHE_SIZE: ${{ secrets.LRU_STATE_CACHE_SIZE }}
          DB_POOL_MIN_SIZE: ${{ secrets.DB_POOL_MIN_SIZE }}
          DB_POOL_MAX_SIZE: ${{ secrets.DB_POOL_MAX_SIZE }}
          # --- AGENTIC RESEARCH ---
          AGENTIC_MODEL: ${{ secrets.AGENTIC_MODEL }}
          AGENTIC_MAX_TOKENS: ${{ secrets.AGENTIC_MAX_TOKENS }}
          AGENTIC_TIMEOUT_SECONDS: ${{ secrets.AGENTIC_TIMEOUT_SECONDS }}
          AGENTIC_MAX_ITERATIONS: ${{ secrets.AGENTIC_MAX_ITERATIONS }}
          AGENTIC_MAX_PAGES: ${{ secrets.AGENTIC_MAX_PAGES }}
          AGENTIC_PAGE_CONTENT_LIMIT: ${{ secrets.AGENTIC_PAGE_CONTENT_LIMIT }}
          ADAPTIVE_THINKING_ENABLED: ${{ secrets.ADAPTIVE_THINKING_ENABLED }}
          # --- IMAGE GENERATION ---
          IMAGE_MODELS: ${{ secrets.IMAGE_MODELS }}
          DEFAULT_IMAGE_MODEL: ${{ secrets.DEFAULT_IMAGE_MODEL }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          IMAGE_GEN_DAILY_LIMIT: ${{ secrets.IMAGE_GEN_DAILY_LIMIT }}
          IMAGE_GEN_RPD_PER_KEY: ${{ secrets.IMAGE_GEN_RPD_PER_KEY }}
          IMAGE_GEN_TIMEOUT: ${{ secrets.IMAGE_GEN_TIMEOUT }}
          IMAGE_GEN_MAX_RETRIES: ${{ secrets.IMAGE_GEN_MAX_RETRIES }}
          # --- VOICE (TTS) ---
          ELEVENLABS_API_KEYS: ${{ secrets.ELEVENLABS_API_KEYS }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          # --- WEBHOOK SECURITY ---
          WEBHOOK_SECRET_TOKEN: ${{ secrets.WEBHOOK_SECRET_TOKEN }}
          # --- THINKING ---
          INLINE_THINKING_LEVEL: ${{ secrets.INLINE_THINKING_LEVEL }}
          # --- LOGGING ---
          STRUCTURED_LOGGING: ${{ secrets.STRUCTURED_LOGGING }}
          LOG_PRETTY: ${{ secrets.LOG_PRETTY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # All env vars forwarded to SSH session
          envs: GITHUB_TOKEN, REPO, REGISTRY, ADMIN_ID, ADMIN_SECRET_B64, TELEGRAM_BOT_TOKEN, DATABASE_URL, REDIS_URL, WEBHOOK_URL, WEBHOOK_SECRET_TOKEN, WEBAPP_BASE_URL, MINIAPP_SHORT_NAME, GAME_HUB_URL, GAME_HUB_DIRECT_LINK, GAME_HUB_MINIAPP_SHORT_NAME, PORT, ENABLE_WEB_SERVER, NATAL_REPORTS_ENABLED, NATAL_REPORT_TTL_DAYS, NATAL_GEOCODER_PROVIDER, NATAL_CITY_OVERRIDES_PATH, NATAL_SEND_RAW_BIRTH_DATA_TO_LLM, TELEGRAM_API_ID, TELEGRAM_API_HASH, GEMINI_API_KEYS, GEMINI_AVAILABLE_MODELS, DEFAULT_MODEL, QNA_MODEL, RESEARCH_MODEL, URL_SELECTION_MODEL, TAXONOMY_MODEL, VERTEX_AI_KEY, VERTEX_AI_PROJECT, VERTEX_AI_LOCATION, VERTEX_LIVE_SERVICE_ACCOUNT_JSON, OPENCODE_API_KEYS, PRIMARY_PROVIDER, OPENCODE_AVAILABLE_MODELS, OPENCODE_DEFAULT_MODEL, OPENCODE_QNA_MODEL, OPENCODE_RESEARCH_MODEL, OPENCODE_VISION_MODEL, OPENCODE_INLINE_MODEL, OPENROUTER_API_KEYS, USE_OPENROUTER, OPENROUTER_AVAILABLE_MODELS, OPENROUTER_DEFAULT_MODEL, OPENROUTER_QNA_MODEL, OPENROUTER_RESEARCH_MODEL, OPENROUTER_URL_SELECTION_MODEL, FREETHEAI_API_KEYS, FREETHEAI_AVAILABLE_MODELS, FREETHEAI_DEFAULT_MODEL, TAVILY_API_KEYS, JINA_API_KEY, WEATHER_API_KEY, EXCHANGE_RATE_API_KEY, DAILY_LIMITS, MAX_CONCURRENT_HEAVY_REQUESTS, MAX_CONCURRENT_HEAVY_CALLBACKS, MAX_CONCURRENT_ULTRA_HEAVY_REQUESTS, LRU_STATE_CACHE_SIZE, DB_POOL_MIN_SIZE, DB_POOL_MAX_SIZE, AGENTIC_MODEL, AGENTIC_MAX_TOKENS, AGENTIC_TIMEOUT_SECONDS, AGENTIC_MAX_ITERATIONS, AGENTIC_MAX_PAGES, AGENTIC_PAGE_CONTENT_LIMIT, ADAPTIVE_THINKING_ENABLED, INLINE_THINKING_LEVEL, IMAGE_MODELS, DEFAULT_IMAGE_MODEL, POLLINATIONS_API_KEY, IMAGE_GEN_DAILY_LIMIT, IMAGE_GEN_RPD_PER_KEY, IMAGE_GEN_TIMEOUT, IMAGE_GEN_MAX_RETRIES, ELEVENLABS_API_KEYS, ELEVENLABS_VOICE_ID, STRUCTURED_LOGGING, LOG_PRETTY
          script: |
            set -e

            # Decode ADMIN_SECRET safely to prevent Bash variable expansion
            export ADMIN_SECRET="$(echo "$ADMIN_SECRET_B64" | base64 -d)"

            echo $GITHUB_TOKEN | docker login $REGISTRY -u ${{ github.actor }} --password-stdin

            docker pull $REGISTRY/$REPO:latest

            # ── Ensure shared infrastructure (idempotent) ────────────────
            docker network create tg-net 2>/dev/null || true
            docker volume create tg-api-data 2>/dev/null || true

            # ── Official cloud Bot API release guard ─────────────────────
            # Local telegram-bot-api has independent webhook state. Before
            # registering the local webhook, always clear/log out the official
            # cloud Bot API side so both backends cannot deliver the same update.
            echo ">>> Releasing official Telegram cloud Bot API state..."
            docker run --rm \
              -e TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
              $REGISTRY/$REPO:latest \
              python /app/scripts/release_cloud_bot_api.py

            # ── Local Telegram Bot API Server ─────────────────────────────
            # Only start if not already running — this is a stable, separate
            # container that does NOT need to restart on every bot deploy.
            if ! docker inspect -f '{{.State.Running}}' tg-api 2>/dev/null | grep -q true; then
              echo ">>> Starting Local Bot API Server (not running)..."
              docker stop tg-api 2>/dev/null || true
              docker rm   tg-api 2>/dev/null || true

              docker run -d \
                --name tg-api \
                --restart unless-stopped \
                --network tg-net \
                -e TELEGRAM_API_ID="$TELEGRAM_API_ID" \
                -e TELEGRAM_API_HASH="$TELEGRAM_API_HASH" \
                -e TELEGRAM_LOCAL=1 \
                -e TZ=Europe/Kyiv \
                -v tg-api-data:/var/lib/telegram-bot-api \
                aiogram/telegram-bot-api:latest

              # Wait for local API server to be ready
              echo ">>> Waiting for Local Bot API Server to start..."
              for i in $(seq 1 30); do
                if docker exec tg-api wget -qO- http://localhost:8081/ 2>/dev/null | grep -q '"ok"'; then
                  echo ">>> Local API Server is ready."
                  break
                fi
                if [ $i -eq 30 ]; then
                  echo ">>> WARNING: Local API Server health check timed out after 60s"
                fi
                sleep 2
              done
            else
              echo ">>> Local API Server already running, skipping restart."
            fi

            # Fix shared volume permissions: telegram-bot-api (uid 101) creates dirs
            # with 700. The bot container runs as 'app' (GID 101) and needs group-read.
            docker exec tg-api chmod -R g+rX /var/lib/telegram-bot-api/ 2>/dev/null || true

            # ── Optional Vertex Live ADC credentials ────────────────────
            VERTEX_LIVE_SECRET_DIR=/opt/gemaibotv2/secrets
            VERTEX_LIVE_SA_HOST_PATH=$VERTEX_LIVE_SECRET_DIR/vertex-live-sa.json
            VERTEX_LIVE_DOCKER_MOUNT=""
            VERTEX_LIVE_DOCKER_ENV=""
            if [ -n "${VERTEX_LIVE_SERVICE_ACCOUNT_JSON:-}" ]; then
              mkdir -p "$VERTEX_LIVE_SECRET_DIR"
              printf '%s' "$VERTEX_LIVE_SERVICE_ACCOUNT_JSON" > "$VERTEX_LIVE_SA_HOST_PATH"
              # The bot container runs as non-root user "app". A bind-mounted ADC file
              # with 0600 is not readable unless numeric UIDs happen to match.
              chmod 644 "$VERTEX_LIVE_SA_HOST_PATH"
              VERTEX_LIVE_DOCKER_MOUNT="-v $VERTEX_LIVE_SA_HOST_PATH:/run/secrets/vertex-live-sa.json:ro"
              VERTEX_LIVE_DOCKER_ENV="-e GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/vertex-live-sa.json"
              echo ">>> Vertex Live ADC secret prepared."
            else
              rm -f "$VERTEX_LIVE_SA_HOST_PATH" 2>/dev/null || true
              echo ">>> Vertex Live ADC secret not configured; Vertex Live will stay disabled."
            fi

            # ── Database Migrations ───────────────────────────────────────
            # Run BEFORE starting the bot container so the schema is always
            # up-to-date at the moment the app starts processing traffic.
            # Uses the same image as the bot (same code, same dependencies).
            # Exits deploy with a non-zero code on migration failure.
            echo ">>> Running database migrations..."
            docker run --rm \
              --name tg-migrate \
              --network tg-net \
              -e DATABASE_URL="$DATABASE_URL" \
              $REGISTRY/$REPO:latest \
              python /app/scripts/migrate.py
            echo ">>> Migrations complete."

            # ── Bot Container ─────────────────────────────────────────────
            docker stop tg-bot || true
            docker rm tg-bot || true

            docker run -d \
              --name tg-bot \
              --restart unless-stopped \
              --network tg-net \
              -p 127.0.0.1:$PORT:$PORT \
              -v tg-api-data:/var/lib/telegram-bot-api \
              ${VERTEX_LIVE_DOCKER_MOUNT:+$VERTEX_LIVE_DOCKER_MOUNT} \
              -e TZ=Europe/Kyiv \
              ${VERTEX_LIVE_DOCKER_ENV:+$VERTEX_LIVE_DOCKER_ENV} \
              -e ADMIN_ID="$ADMIN_ID" \
              -e ADMIN_SECRET="$ADMIN_SECRET" \
              -e TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
              -e DATABASE_URL="$DATABASE_URL" \
              -e REDIS_URL="$REDIS_URL" \
              -e WEBHOOK_URL="$WEBHOOK_URL" \
              -e WEBAPP_BASE_URL="$WEBAPP_BASE_URL" \
              -e MINIAPP_SHORT_NAME="$MINIAPP_SHORT_NAME" \
              -e GAME_HUB_URL="$GAME_HUB_URL" \
              -e GAME_HUB_DIRECT_LINK="$GAME_HUB_DIRECT_LINK" \
              -e GAME_HUB_MINIAPP_SHORT_NAME="$GAME_HUB_MINIAPP_SHORT_NAME" \
              -e PORT="$PORT" \
              -e ENABLE_WEB_SERVER="$ENABLE_WEB_SERVER" \
              -e NATAL_REPORTS_ENABLED="$NATAL_REPORTS_ENABLED" \
              -e NATAL_REPORT_TTL_DAYS="$NATAL_REPORT_TTL_DAYS" \
              -e NATAL_GEOCODER_PROVIDER="$NATAL_GEOCODER_PROVIDER" \
              -e NATAL_CITY_OVERRIDES_PATH="$NATAL_CITY_OVERRIDES_PATH" \
              -e NATAL_SEND_RAW_BIRTH_DATA_TO_LLM="$NATAL_SEND_RAW_BIRTH_DATA_TO_LLM" \
              -e TELEGRAM_LOCAL_SERVER_URL="http://tg-api:8081/bot" \
              -e GEMINI_API_KEYS="$GEMINI_API_KEYS" \
              -e GEMINI_AVAILABLE_MODELS="$GEMINI_AVAILABLE_MODELS" \
              -e DEFAULT_MODEL="$DEFAULT_MODEL" \
              -e QNA_MODEL="$QNA_MODEL" \
              -e RESEARCH_MODEL="$RESEARCH_MODEL" \
              -e URL_SELECTION_MODEL="$URL_SELECTION_MODEL" \
              -e TAXONOMY_MODEL="$TAXONOMY_MODEL" \
              -e VERTEX_AI_KEY="$VERTEX_AI_KEY" \
              -e VERTEX_AI_PROJECT="$VERTEX_AI_PROJECT" \
              -e VERTEX_AI_LOCATION="$VERTEX_AI_LOCATION" \
              -e OPENCODE_API_KEYS="$OPENCODE_API_KEYS" \
              -e PRIMARY_PROVIDER="$PRIMARY_PROVIDER" \
              -e OPENCODE_AVAILABLE_MODELS="$OPENCODE_AVAILABLE_MODELS" \
              -e OPENCODE_DEFAULT_MODEL="$OPENCODE_DEFAULT_MODEL" \
              -e OPENCODE_QNA_MODEL="$OPENCODE_QNA_MODEL" \
              -e OPENCODE_RESEARCH_MODEL="$OPENCODE_RESEARCH_MODEL" \
              -e OPENCODE_VISION_MODEL="$OPENCODE_VISION_MODEL" \
              -e OPENCODE_INLINE_MODEL="$OPENCODE_INLINE_MODEL" \
              -e OPENROUTER_API_KEYS="$OPENROUTER_API_KEYS" \
              -e USE_OPENROUTER="$USE_OPENROUTER" \
              -e OPENROUTER_AVAILABLE_MODELS="$OPENROUTER_AVAILABLE_MODELS" \
              -e OPENROUTER_DEFAULT_MODEL="$OPENROUTER_DEFAULT_MODEL" \
              -e OPENROUTER_QNA_MODEL="$OPENROUTER_QNA_MODEL" \
              -e OPENROUTER_RESEARCH_MODEL="$OPENROUTER_RESEARCH_MODEL" \
              -e OPENROUTER_URL_SELECTION_MODEL="$OPENROUTER_URL_SELECTION_MODEL" \
              -e FREETHEAI_API_KEYS="$FREETHEAI_API_KEYS" \
              -e FREETHEAI_AVAILABLE_MODELS="$FREETHEAI_AVAILABLE_MODELS" \
              -e FREETHEAI_DEFAULT_MODEL="$FREETHEAI_DEFAULT_MODEL" \
              -e TAVILY_API_KEYS="$TAVILY_API_KEYS" \
              -e JINA_API_KEY="$JINA_API_KEY" \
              -e WEATHER_API_KEY="$WEATHER_API_KEY" \
              -e EXCHANGE_RATE_API_KEY="$EXCHANGE_RATE_API_KEY" \
              -e DAILY_LIMITS="$DAILY_LIMITS" \
              -e MAX_CONCURRENT_HEAVY_REQUESTS="$MAX_CONCURRENT_HEAVY_REQUESTS" \
              -e MAX_CONCURRENT_HEAVY_CALLBACKS="$MAX_CONCURRENT_HEAVY_CALLBACKS" \
              -e MAX_CONCURRENT_ULTRA_HEAVY_REQUESTS="$MAX_CONCURRENT_ULTRA_HEAVY_REQUESTS" \
              -e LRU_STATE_CACHE_SIZE="$LRU_STATE_CACHE_SIZE" \
              -e DB_POOL_MIN_SIZE="$DB_POOL_MIN_SIZE" \
              -e DB_POOL_MAX_SIZE="$DB_POOL_MAX_SIZE" \
              -e AGENTIC_MODEL="$AGENTIC_MODEL" \
              -e AGENTIC_MAX_TOKENS="$AGENTIC_MAX_TOKENS" \
              -e AGENTIC_TIMEOUT_SECONDS="$AGENTIC_TIMEOUT_SECONDS" \
              -e AGENTIC_MAX_ITERATIONS="$AGENTIC_MAX_ITERATIONS" \
              -e AGENTIC_MAX_PAGES="$AGENTIC_MAX_PAGES" \
              -e AGENTIC_PAGE_CONTENT_LIMIT="$AGENTIC_PAGE_CONTENT_LIMIT" \
              -e ADAPTIVE_THINKING_ENABLED="$ADAPTIVE_THINKING_ENABLED" \
              -e IMAGE_MODELS="$IMAGE_MODELS" \
              -e DEFAULT_IMAGE_MODEL="$DEFAULT_IMAGE_MODEL" \
              -e POLLINATIONS_API_KEY="$POLLINATIONS_API_KEY" \
              -e IMAGE_GEN_DAILY_LIMIT="$IMAGE_GEN_DAILY_LIMIT" \
              -e IMAGE_GEN_RPD_PER_KEY="$IMAGE_GEN_RPD_PER_KEY" \
              -e IMAGE_GEN_TIMEOUT="$IMAGE_GEN_TIMEOUT" \
              -e IMAGE_GEN_MAX_RETRIES="$IMAGE_GEN_MAX_RETRIES" \
              -e ELEVENLABS_API_KEYS="$ELEVENLABS_API_KEYS" \
              -e ELEVENLABS_VOICE_ID="$ELEVENLABS_VOICE_ID" \
              -e WEBHOOK_SECRET_TOKEN="$WEBHOOK_SECRET_TOKEN" \
              -e INLINE_THINKING_LEVEL="$INLINE_THINKING_LEVEL" \
              -e STRUCTURED_LOGGING="$STRUCTURED_LOGGING" \
              -e LOG_PRETTY="$LOG_PRETTY" \
              $REGISTRY/$REPO:latest

            if [ "$(printf '%s' "$NATAL_REPORTS_ENABLED" | tr '[:upper:]' '[:lower:]')" = "true" ]; then
              echo ">>> Running natal chart report maintenance..."
              docker exec tg-bot python /app/scripts/natal_maintenance.py
            fi

            # ── Media Cleanup Cron ────────────────────────────────────────
            # Deletes cached media files older than 7 days. Runs every 24h.
            docker stop tg-media-cleanup || true
            docker rm tg-media-cleanup || true

            docker run -d \
              --name tg-media-cleanup \
              --restart unless-stopped \
              --network tg-net \
              -v tg-api-data:/var/lib/telegram-bot-api \
              -e TZ=Europe/Kyiv \
              alpine:3.21 \
              sh -c 'LAST_CLEANUP=0; while true; do chmod -R g+rX /var/lib/telegram-bot-api/ 2>/dev/null; NOW=$(date +%s); if [ $((NOW - LAST_CLEANUP)) -ge 86400 ]; then echo "[cleanup] Deleting files older than 7 days..."; find /var/lib/telegram-bot-api -type f -mtime +7 -delete 2>/dev/null; LAST_CLEANUP=$NOW; echo "[cleanup] Done."; fi; sleep 60; done'

            docker image prune -f
