[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
addopts = -n auto --dist=loadgroup --basetemp=.pytest_tmp --timeout=30
markers =
    unit: Standard unit test marker
    integration: Integration test marker
    browser: Local Chromium regressions requiring tests/browser dependencies
    slow: Slow test marker
filterwarnings =
    error::RuntimeWarning
    error::pytest.PytestUnraisableExceptionWarning
    ignore:.*_UnionGenericAlias.*:DeprecationWarning:google\.genai.*
    ignore:.*Inheritance class AiohttpClientSession.*:DeprecationWarning:google\.genai.*
