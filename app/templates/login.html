<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GemAI Bot v2 | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Work+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style nonce="{{ g.csp_nonce }}">
      :root {
        --bg: #0a0e1a;
        --surface: rgba(255, 255, 255, 0.04);
        --border: rgba(255, 255, 255, 0.08);
        --text: #e2e8f0;
        --text-muted: #64748b;
        --accent: #06b6d4;
        --accent-glow: rgba(6, 182, 212, 0.25);
        --error: #f43f5e;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Work Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-image:
          radial-gradient(
            ellipse at 20% 50%,
            rgba(6, 182, 212, 0.08) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at 80% 50%,
            rgba(139, 92, 246, 0.06) 0%,
            transparent 50%
          );
      }
      .login-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 3rem 2.5rem;
        width: 100%;
        max-width: 380px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        animation: cardIn 0.6s ease-out;
      }
      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(20px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .logo {
        text-align: center;
        margin-bottom: 2rem;
      }
      .logo h1 {
        font-family: "JetBrains Mono", monospace;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .logo .sub {
        color: var(--text-muted);
        font-size: 0.8rem;
        margin-top: 0.3rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      .field {
        margin-bottom: 1.5rem;
      }
      .field label {
        display: block;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-muted);
        margin-bottom: 0.5rem;
      }
      .field input {
        width: 100%;
        padding: 0.8rem 1rem;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: var(--text);
        font-family: "JetBrains Mono", monospace;
        font-size: 0.95rem;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .field input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-glow);
      }
      .btn {
        width: 100%;
        padding: 0.85rem;
        background: linear-gradient(135deg, var(--accent), #0891b2);
        border: none;
        border-radius: 10px;
        color: #fff;
        font-family: "Work Sans", sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        cursor: pointer;
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }
      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px var(--accent-glow);
      }
      .btn:active {
        transform: translateY(0);
      }
      .error-msg {
        background: rgba(244, 63, 94, 0.1);
        border: 1px solid rgba(244, 63, 94, 0.3);
        color: var(--error);
        padding: 0.7rem 1rem;
        border-radius: 8px;
        font-size: 0.85rem;
        margin-bottom: 1.5rem;
        animation: shake 0.4s ease-in-out;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-5px);
        }
        75% {
          transform: translateX(5px);
        }
      }
    </style>
  </head>
  <body>
    <form class="login-card" method="POST" action="{{ url_for('login_page') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <div class="logo">
        <h1>GEMAIBOT v2</h1>
        <div class="sub">Operations Dashboard</div>
      </div>

      {% if error %}
      <div class="error-msg" role="alert">{{ error }}</div>
      {% endif %}

      <div class="field">
        <label for="password">Admin Password</label>
        <input
          type="password"
          id="password"
          name="password"
          autofocus
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" class="btn">Sign In</button>
    </form>
  </body>
</html>
