<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Admin: Daily Crocodile</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: var(--tg-theme-bg-color, #ffffff);
  --text: var(--tg-theme-text-color, #000000);
  --hint: var(--tg-theme-hint-color, #999999);
  --link: var(--tg-theme-link-color, #2678b6);
  --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
  --destructive: var(--tg-theme-destructive-text-color, #e53935);
  --section-bg: var(--tg-theme-section-bg-color, var(--bg));
  --radius: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
  font-family: -apple-system, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html { height: 100%; overflow: hidden; }
body {
  background: var(--secondary-bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  height: 100%;
  overflow: auto;
  overscroll-behavior-y: none;
  padding-bottom: 32px;
}
.header {
  padding: 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--secondary-bg);
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header h1 { font-size: 18px; font-weight: 600; }
.puzzle-list { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.puzzle-card {
  background: var(--section-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.card-body { padding: 14px 16px 0; }
.puzzle-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.puzzle-date { font-size: 14px; font-weight: 600; color: var(--hint); }
.puzzle-diff {
  font-size: 11px; padding: 2px 8px; border-radius: 10px;
  background: var(--secondary-bg); color: var(--text);
  font-weight: 500; text-transform: uppercase; letter-spacing: .5px;
}
.diff-easy { color: #4caf50; background: rgba(76,175,80,.1); }
.diff-hard { color: #ef5350; background: rgba(239,83,80,.1); }
.puzzle-word { font-size: 18px; font-weight: 700; margin-bottom: 2px; }
.puzzle-topic { font-size: 13px; color: var(--hint); margin-bottom: 12px; }

/* Image preview */
.image-preview {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  background: var(--secondary-bg);
  display: block;
  margin-bottom: 0;
}
.image-placeholder {
  width: 100%; aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.06);
  color: var(--hint); font-size: 13px;
  border-top: 1px solid rgba(0,0,0,.05);
  border-bottom: 1px solid rgba(0,0,0,.05);
}

/* Prompt section */
.prompt-section { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(0,0,0,.05); }
.prompt-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.btn-text { background: none; border: none; color: var(--link); font-size: 13px; font-weight: 500; cursor: pointer; }
.puzzle-prompt { font-size: 13px; line-height: 1.4; word-break: break-word; color: var(--text); }
.prompt-input { width: 100%; min-height: 80px; padding: 8px; border-radius: 6px; border: 1px solid var(--hint); background: var(--bg); color: var(--text); font-family: inherit; font-size: 13px; resize: vertical; margin-bottom: 8px; }

/* Buttons area */
.card-actions { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.btn {
  background: var(--secondary-bg); color: var(--link);
  border: none; padding: 10px 16px; border-radius: 8px;
  font-size: 14px; font-weight: 500; width: 100%;
  cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px;
  transition: opacity .15s;
}
.btn:active { opacity: .7; }
.btn:disabled { opacity: .45; cursor: default; }
.btn-regen { background: color-mix(in srgb, var(--link) 10%, transparent); }
.btn-reset { background: color-mix(in srgb, var(--destructive) 10%, transparent); color: var(--destructive); }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { flex: 1; }

.loading-container { padding: 32px; text-align: center; color: var(--hint); }
.badge-missing {
  display: inline-block; font-size: 12px; padding: 4px 8px;
  border-radius: 4px; background: rgba(239,83,80,.1); color: #ef5350;
  font-weight: 600; margin-bottom: 12px;
}
</style>
</head>
<body>

<div class="header">
  <h1>Daily Crocodile</h1>
  <button class="btn" style="width:auto;padding:6px 12px;" onclick="loadPuzzles()">🔄</button>
</div>

<div class="puzzle-list" id="puzzle-container">
  <div class="loading-container">Loading puzzles...</div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
tg.setHeaderColor('bg_color');
tg.setBackgroundColor('secondary_bg_color');

const apiHeaders = {
  'Authorization': 'tma ' + tg.initData,
  'Content-Type': 'application/json'
};

// GET headers (no Content-Type for GET with fetch)
const getHeaders = { 'Authorization': 'tma ' + tg.initData };

async function loadImage(imgEl) {
  const fileId = imgEl.dataset.fileId;
  if (!fileId) return;
  try {
    const res = await fetch(
      '/webapp/api/admin/dailycroc/image?file_id=' + encodeURIComponent(fileId),
      { headers: getHeaders }
    );
    if (!res.ok) { imgEl.style.display = 'none'; return; }
    const blob = await res.blob();
    imgEl.src = URL.createObjectURL(blob);
  } catch { imgEl.style.display = 'none'; }
}

async function loadPuzzles() {
  const container = document.getElementById('puzzle-container');
  container.innerHTML = '<div class="loading-container">Loading...</div>';
  try {
    const res = await fetch('/webapp/api/admin/dailycroc', { headers: getHeaders });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    renderPuzzles(data.puzzles);
  } catch (e) {
    container.innerHTML = `<div class="loading-container" style="color:var(--destructive)">Error: ${e.message}</div>`;
  }
}

function renderPuzzles(puzzles) {
  const container = document.getElementById('puzzle-container');
  container.innerHTML = '';
  if (!puzzles || !puzzles.length) {
    container.innerHTML = '<div class="loading-container">No puzzles found.</div>';
    return;
  }
  console.log('[dailycroc] first puzzle sample:', JSON.stringify(puzzles[0]));
  console.log('[dailycroc] image_file_id values:', puzzles.map(p => p.date + '/' + p.difficulty + ':' + JSON.stringify(p.image_file_id)));
  // Sort: ascending by date (earliest first), easy before hard within same date
  puzzles.sort((a, b) => {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    return a.difficulty === 'easy' ? -1 : 1;
  });

  puzzles.forEach(p => {
    const isMissing = !p.target_word;
    const dateObj = new Date(p.date);
    const dateStr = dateObj.toLocaleDateString('ru-RU', { weekday: 'short', month: 'short', day: 'numeric' });
    const diffClass = p.difficulty === 'easy' ? 'diff-easy' : 'diff-hard';
    const cardId = `card-${p.date}-${p.difficulty}`;

    const card = document.createElement('div');
    card.className = 'puzzle-card';
    card.id = cardId;

    // Build image section — use data-file-id so loadImage() can fetch with auth header
    let imageSection = '';
    if (!isMissing) {
      if (p.image_file_id) {
        const escapedId = p.image_file_id.replace(/"/g, '&quot;');
        imageSection = `<img class="image-preview" data-file-id="${escapedId}" alt="puzzle image">`;
      } else {
        imageSection = `<div class="image-placeholder">❌ No image</div>`;
      }
    }

    card.innerHTML = `
      <div class="card-body">
        <div class="puzzle-header">
          <div class="puzzle-date">${dateStr}</div>
          <div class="puzzle-diff ${diffClass}">${p.difficulty}</div>
        </div>
        ${isMissing
          ? `<div class="badge-missing">Not Prepared</div>`
          : `<div class="puzzle-word">${p.target_word}</div>
             <div class="puzzle-topic">${p.topic || '—'}</div>
             <div class="prompt-section">
               <div class="prompt-header">
                 <span style="font-size:12px;color:var(--hint);font-weight:600">IMAGE PROMPT</span>
                 <button class="btn-text" onclick="editPrompt('${p.date}', '${p.difficulty}')">✏️ Edit</button>
               </div>
               <div class="puzzle-prompt" id="prompt-text-${p.date}-${p.difficulty}">${p.image_prompt || '<i>(No prompt)</i>'}</div>
               <div class="prompt-edit" id="prompt-edit-${p.date}-${p.difficulty}" style="display:none;">
                 <textarea class="prompt-input" id="prompt-input-${p.date}-${p.difficulty}">${p.image_prompt || ''}</textarea>
                 <div class="btn-row">
                   <button class="btn" style="background:var(--link);color:#fff" onclick="savePrompt('${p.date}', '${p.difficulty}')">Save</button>
                   <button class="btn" onclick="cancelEditPrompt('${p.date}', '${p.difficulty}')">Cancel</button>
                 </div>
               </div>
             </div>`
        }
      </div>
      ${imageSection}
      <div class="card-actions">
        <div class="btn-row">
          <button class="btn btn-regen" id="regen-${p.date}-${p.difficulty}"
            onclick="regenerate('${p.date}', '${p.difficulty}')"
            ${isMissing ? 'disabled' : ''}>
            🖼 Regen Image
          </button>
          <button class="btn btn-reset" id="reset-${p.date}-${p.difficulty}"
            onclick="resetWord('${p.date}', '${p.difficulty}')">
            🔀 New Word
          </button>
        </div>
      </div>
    `;
    container.appendChild(card);
    // Load images via authenticated fetch (img src can't carry auth headers)
    card.querySelectorAll('img[data-file-id]').forEach(loadImage);
  });
}

async function regenerate(date, diff) {
  if (!confirm(`Regenerate image for ${date} (${diff})? This replaces the current image.`)) return;
  const btn = document.getElementById(`regen-${date}-${diff}`);
  btn.disabled = true; btn.textContent = '⏳ Regenerating…';
  tg.HapticFeedback.impactOccurred('medium');
  try {
    const res = await fetch('/webapp/api/admin/dailycroc/regenerate', {
      method: 'POST', headers: apiHeaders,
      body: JSON.stringify({ date, difficulty: diff })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    tg.HapticFeedback.notificationOccurred('success');
    await loadPuzzles();
  } catch (e) {
    tg.HapticFeedback.notificationOccurred('error');
    tg.showAlert(`Error: ${e.message}`);
    btn.disabled = false; btn.textContent = '🖼 Regen Image';
  }
}

function editPrompt(date, diff) {
  document.getElementById(`prompt-text-${date}-${diff}`).style.display = 'none';
  document.getElementById(`prompt-edit-${date}-${diff}`).style.display = 'block';
}

function cancelEditPrompt(date, diff) {
  document.getElementById(`prompt-text-${date}-${diff}`).style.display = 'block';
  document.getElementById(`prompt-edit-${date}-${diff}`).style.display = 'none';
}

async function savePrompt(date, diff) {
  const newPrompt = document.getElementById(`prompt-input-${date}-${diff}`).value;
  tg.HapticFeedback.impactOccurred('light');
  try {
    const res = await fetch('/webapp/api/admin/dailycroc/prompt', {
      method: 'POST', headers: apiHeaders,
      body: JSON.stringify({ date, difficulty: diff, prompt: newPrompt })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    tg.HapticFeedback.notificationOccurred('success');
    
    // Update UI directly instead of reloading everything
    document.getElementById(`prompt-text-${date}-${diff}`).textContent = newPrompt || '(No prompt)';
    cancelEditPrompt(date, diff);
  } catch (e) {
    tg.HapticFeedback.notificationOccurred('error');
    tg.showAlert(`Error saving prompt: ${e.message}`);
  }
}

async function resetWord(date, diff) {
  if (!confirm(`Replace word for ${date} (${diff}) with a new one? This deletes the current puzzle and all its data.`)) return;
  const btn = document.getElementById(`reset-${date}-${diff}`);
  btn.disabled = true; btn.textContent = '⏳ Resetting…';
  tg.HapticFeedback.impactOccurred('heavy');
  try {
    const res = await fetch('/webapp/api/admin/dailycroc/reset-word', {
      method: 'POST', headers: apiHeaders,
      body: JSON.stringify({ date, difficulty: diff })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    tg.HapticFeedback.notificationOccurred('success');
    tg.showAlert(`New word: ${data.new_word} (${data.new_topic})`);
    await loadPuzzles();
  } catch (e) {
    tg.HapticFeedback.notificationOccurred('error');
    tg.showAlert(`Error: ${e.message}`);
    btn.disabled = false; btn.textContent = '🔀 New Word';
  }
}

loadPuzzles();
</script>
</body>
</html>
