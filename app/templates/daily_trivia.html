<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Daily Trivia</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- bot_username injected by Jinja2 for deep links -->
  <script>const BOT_USERNAME = "{{ bot_username }}";</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.2);
      --correct: #10b981;
      --correct-bg: rgba(16, 185, 129, 0.15);
      --wrong: #f43f5e;
      --wrong-bg: rgba(244, 63, 94, 0.15);
      --amber: #fbbf24;
      --radius: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-color);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 40%);
    }

    .container {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .q-counter {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: var(--accent);
      background: var(--accent-glow);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .score-badge {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--amber);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Progress bar */
    .progress-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 3px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #8b5cf6);
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 3px;
    }

    /* Question card */
    .question-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .topic-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .question-text {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text-main);
    }

    /* Options */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 14px 18px;
      color: var(--text-main);
      font-size: 1rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .option-btn:hover:not(.disabled) {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .option-btn.selected-correct {
      background: var(--correct-bg) !important;
      border-color: var(--correct) !important;
      color: #a7f3d0 !important;
      font-weight: 600;
    }

    .option-btn.selected-wrong {
      background: var(--wrong-bg) !important;
      border-color: var(--wrong) !important;
      color: #fecdd3 !important;
    }

    .option-btn.reveal-correct {
      border-color: var(--correct) !important;
      background: rgba(16, 185, 129, 0.08) !important;
    }

    .option-btn.disabled {
      cursor: default;
      opacity: 0.7;
    }

    /* Explanation card */
    .explanation-card {
      background: rgba(56, 189, 248, 0.06);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 20px;
      animation: fadeIn 0.3s ease;
    }

    .explanation-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .explanation-body {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #cbd5e1;
    }

    /* Buttons */
    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #38bdf8, #8b5cf6);
      border: none;
      border-radius: var(--radius);
      padding: 16px;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s ease;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
      margin-top: auto;
    }

    .btn-primary:active {
      opacity: 0.85;
    }

    .btn-secondary {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 14px;
      color: var(--text-muted);
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 12px;
    }

    .btn-secondary:active {
      opacity: 0.75;
    }

    /* Finish Screen */
    .finish-card {
      text-align: center;
      padding: 30px 20px;
      margin: auto 0;
    }

    .finish-title {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #38bdf8, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .finish-score {
      font-size: 3rem;
      font-weight: 800;
      color: var(--amber);
      margin-bottom: 6px;
      font-family: 'Outfit', sans-serif;
    }

    .finish-subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 30px;
    }

    /* Already-completed banner */
    .already-done-badge {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--correct);
      background: var(--correct-bg);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 20px;
      padding: 4px 12px;
      margin-bottom: 18px;
    }

    /* Review Screen */
    .review-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .review-back-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 12px;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .review-back-btn:active {
      opacity: 0.7;
    }

    .review-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
    }

    /* Accordion item */
    .accordion-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .accordion-item.correct-item {
      border-color: rgba(16, 185, 129, 0.3);
    }

    .accordion-item.wrong-item {
      border-color: rgba(244, 63, 94, 0.25);
    }

    .accordion-trigger {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      cursor: pointer;
      width: 100%;
      background: none;
      border: none;
      text-align: left;
      color: var(--text-main);
    }

    .accordion-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .icon-correct {
      background: var(--correct-bg);
      color: var(--correct);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .icon-wrong {
      background: var(--wrong-bg);
      color: var(--wrong);
      border: 1px solid rgba(244, 63, 94, 0.4);
    }

    .accordion-question-text {
      flex: 1;
      font-size: 0.9rem;
      font-weight: 500;
      line-height: 1.4;
      color: var(--text-main);
    }

    .accordion-chevron {
      color: var(--text-muted);
      font-size: 0.75rem;
      transition: transform 0.25s ease;
      flex-shrink: 0;
    }

    .accordion-item.open .accordion-chevron {
      transform: rotate(180deg);
    }

    .accordion-body {
      display: none;
      padding: 0 16px 16px 16px;
      animation: fadeIn 0.2s ease;
    }

    .accordion-item.open .accordion-body {
      display: block;
    }

    .review-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .review-option {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      border: 1px solid transparent;
    }

    .review-option.ro-correct {
      background: var(--correct-bg);
      border-color: rgba(16, 185, 129, 0.35);
      color: #a7f3d0;
    }

    .review-option.ro-wrong-selected {
      background: var(--wrong-bg);
      border-color: rgba(244, 63, 94, 0.35);
      color: #fecdd3;
    }

    .review-option.ro-neutral {
      background: rgba(255, 255, 255, 0.03);
      border-color: var(--border-color);
      color: var(--text-muted);
    }

    .review-fact {
      background: rgba(56, 189, 248, 0.06);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .review-fact-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 5px;
    }

    .review-fact-body {
      font-size: 0.875rem;
      line-height: 1.5;
      color: #cbd5e1;
    }

    /* AI deep-dive button inside accordion */
    .btn-ai-more {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 8px 14px;
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: 10px;
      color: #c4b5fd;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-ai-more:active {
      opacity: 0.75;
    }

    /* Super Game Styles */
    @keyframes superRainbow {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .super-title {
      background: linear-gradient(90deg, #ff0080, #ff8c00, #ffe600, #00e5ff, #8000ff, #ff0080);
      background-size: 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: superRainbow 3s linear infinite;
      font-weight: 900;
      font-family: 'Outfit', sans-serif;
    }

    .super-badge-header {
      background: linear-gradient(135deg, rgba(255, 0, 128, 0.2), rgba(0, 229, 255, 0.2));
      border: 1px solid rgba(255, 0, 128, 0.4);
      color: #ff80bf;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-super {
      width: 100%;
      background: linear-gradient(90deg, #ff0080, #ff8c00, #00e5ff, #8000ff);
      background-size: 300%;
      animation: superRainbow 4s linear infinite;
      border: none;
      border-radius: var(--radius);
      padding: 16px;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255, 0, 128, 0.4);
      margin-top: 14px;
      transition: opacity 0.2s ease;
    }

    .btn-super:active {
      opacity: 0.85;
    }

    .super-divider {
      margin: 24px 0 16px 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .super-divider-line {
      flex: 1;
      height: 1px;
      background: rgba(255, 0, 128, 0.3);
    }

    .super-divider-text {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
    }

    .super-locked-box {
      background: rgba(255, 0, 128, 0.05);
      border: 1px dashed rgba(255, 0, 128, 0.3);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
      margin-top: 10px;
    }

    .super-locked-text {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="top-bar">
      <div class="q-counter" id="qCounter">Вопрос 1/5</div>
      <div class="score-badge" id="scoreBadge">⭐ 0</div>
    </div>

    <div class="progress-container">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- Game Screen -->
    <div id="gameView">
      <div class="question-card">
        <div class="topic-badge" id="topicBadge">Загрузка...</div>
        <div class="question-text" id="questionText">Пожалуйста, подождите...</div>
      </div>

      <div class="options-grid" id="optionsGrid"></div>

      <div class="explanation-card" id="explanationCard" style="display: none;">
        <div class="explanation-title">💡 Знаете ли вы?</div>
        <div class="explanation-body" id="explanationText"></div>
      </div>

      <button class="btn-primary" id="nextBtn" style="display: none;">Продолжить</button>
    </div>

    <!-- Super Game Screen -->
    <div id="superView" style="display: none;">
      <div class="question-card" style="border-color: rgba(255, 0, 128, 0.3);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <div class="topic-badge super-title" id="superTopicBadge">⚡ СУПЕРИГРА</div>
          <div class="super-badge-header">⚡ Ставки ×2</div>
        </div>
        <div class="question-text" id="superQuestionText">...</div>
      </div>

      <div class="options-grid" id="superOptionsGrid"></div>

      <div class="explanation-card" id="superExplanationCard" style="display: none; border-color: rgba(255, 0, 128, 0.3); background: rgba(255, 0, 128, 0.06);">
        <div class="explanation-title" style="color: #ff80bf;">💡 Знаете ли вы?</div>
        <div class="explanation-body" id="superExplanationText"></div>
      </div>

      <button class="btn-super" id="superNextBtn" style="display: none;">Продолжить</button>
    </div>

    <!-- Finish Screen -->
    <div id="finishView" style="display: none;" class="question-card finish-card">
      <div id="alreadyDoneBadge" class="already-done-badge" style="display: none;">✓ Уже пройдено сегодня</div>
      <div class="finish-title">Викторина завершена!</div>
      <div class="finish-score" id="finalScore">0</div>
      <div class="finish-subtitle" id="finalDetails">Вы правильно ответили на 0 из 5 вопросов</div>
      <button class="btn-super" id="superStartBtn">⚡ Сыграть Суперигру (×2 ставки)</button>
      <div id="superDoneStatus" style="display: none; margin-top: 10px;" class="already-done-badge">✓ Суперигра пройдена</div>
      <button class="btn-primary" id="closeBtn" style="margin-top: 12px;">Закрыть</button>
      <button class="btn-secondary" id="reviewBtn">📋 Просмотреть ответы</button>
    </div>

    <!-- Super Finish Screen -->
    <div id="superFinishView" style="display: none;" class="question-card finish-card">
      <div class="super-title" style="font-size: 1.8rem; margin-bottom: 12px;">⚡ Суперигра завершена!</div>
      <div class="finish-score" id="superDeltaDisplay" style="color: #ff80bf;">+0</div>
      <div class="finish-subtitle" id="superFinishSubtitle">Итоговый результат дня: 0 очков</div>
      <button class="btn-primary" id="superCloseBtn">Закрыть</button>
      <button class="btn-secondary" id="superReviewBtn">📋 Просмотреть ответы</button>
    </div>

    <!-- Review Screen -->
    <div id="reviewView" style="display: none;">
      <div class="review-header">
        <button class="review-back-btn" id="backToFinishBtn">← Назад</button>
        <div class="review-title">Разбор ответов</div>
      </div>
      <div id="reviewAccordion"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
      tg.expand();
      tg.ready();
      if (tg.setTitle) tg.setTitle('Daily Trivia');
      if (tg.setHeaderColor) tg.setHeaderColor('bg_color');
    }

    let questions = [];
    let superQuestions = [];
    let playerAnswers = [];
    let superPlayerAnswers = [];
    let puzzleDate = '';
    let puzzleRevisionId = null;
    let currentIdx = 0;
    let currentSuperIdx = 0;
    let totalScore = 0;
    let correctCount = 0;
    let superDeltaScore = 0;
    let superCorrectCount = 0;
    let userSuperResult = null;
    let startTime = 0;
    let answered = false;

    // Wire up static buttons via addEventListener (CSP-safe)
    document.getElementById('nextBtn').addEventListener('click', nextQuestion);
    document.getElementById('superNextBtn').addEventListener('click', nextSuperQuestion);
    document.getElementById('superStartBtn').addEventListener('click', startSuperGame);
    document.getElementById('closeBtn').addEventListener('click', function () {
      if (tg) tg.close(); else window.close();
    });
    document.getElementById('superCloseBtn').addEventListener('click', function () {
      if (tg) tg.close(); else window.close();
    });
    document.getElementById('reviewBtn').addEventListener('click', showReviewScreen);
    document.getElementById('superReviewBtn').addEventListener('click', showReviewScreen);
    document.getElementById('backToFinishBtn').addEventListener('click', function () {
      document.getElementById('reviewView').style.display = 'none';
      if (userSuperResult && userSuperResult.status === 'completed') {
        document.getElementById('superFinishView').style.display = 'block';
      } else {
        document.getElementById('finishView').style.display = 'block';
      }
    });

    async function defInit() {
      try {
        const response = await fetch('/webapp/api/miniapp/trivia/today', {
          headers: { 'X-TG-INIT-DATA': tg ? tg.initData : '' }
        });
        const data = await response.json();

        if (!data.questions || data.questions.length === 0) {
          document.getElementById('questionText').innerText = 'Не удалось загрузить вопросы на сегодня.';
          return;
        }

        questions = data.questions;
        superQuestions = data.super_questions || [];
        puzzleDate = data.date || '';
        puzzleRevisionId = data.revision_id ?? null;
        playerAnswers = new Array(questions.length).fill(null);
        superPlayerAnswers = new Array(superQuestions.length).fill(null);

        userSuperResult = data.user_super_result || null;
        if (userSuperResult && userSuperResult.status === 'completed') {
          superDeltaScore = userSuperResult.delta_score || 0;
          superCorrectCount = userSuperResult.correct_count || 0;
          if (Array.isArray(userSuperResult.answers)) {
            userSuperResult.answers.forEach(function (a) {
              const qi = a.question_index;
              if (qi >= 0 && qi < superQuestions.length) {
                superPlayerAnswers[qi] = {
                  selectedIdx: a.selected_index,
                  isCorrect: a.is_correct
                };
              }
            });
          }
        }

        if (data.user_result && data.user_result.status === 'completed') {
          const r = data.user_result;
          totalScore = r.final_score || 0;
          correctCount = r.correct_count || 0;

          if (Array.isArray(r.answers)) {
            r.answers.forEach(function (a) {
              const qi = a.question_index;
              if (qi >= 0 && qi < questions.length) {
                playerAnswers[qi] = {
                  selectedIdx: a.selected_index,
                  isCorrect: a.is_correct
                };
              }
            });
          }

          showFinishScreen(true /* alreadyDone */);
          return;
        }

        renderQuestion();
      } catch (e) {
        document.getElementById('questionText').innerText = 'Ошибка соединения.';
      }
    }

    function renderQuestion() {
      if (currentIdx >= questions.length) {
        showFinishScreen(false);
        return;
      }

      answered = false;
      const q = questions[currentIdx];

      document.getElementById('qCounter').innerText = `Вопрос ${currentIdx + 1}/${questions.length}`;
      document.getElementById('progressFill').style.width = `${(currentIdx / questions.length) * 100}%`;
      document.getElementById('topicBadge').innerText = q.topic || 'Тривиа';
      document.getElementById('questionText').innerText = q.question;
      document.getElementById('explanationCard').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'none';

      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';

      q.options.forEach(function (optText, idx) {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = optText;
        btn.addEventListener('click', function () { selectAnswer(idx); });
        grid.appendChild(btn);
      });

      startTime = Date.now();
    }

    function selectAnswer(selectedIdx) {
      if (answered) return;
      answered = true;

      const elapsedMs = Date.now() - startTime;
      const q = questions[currentIdx];
      const isCorrect = (selectedIdx === q.correct_index);

      playerAnswers[currentIdx] = { selectedIdx: selectedIdx, isCorrect: isCorrect };

      const grid = document.getElementById('optionsGrid');
      const buttons = grid.children;

      for (let i = 0; i < buttons.length; i++) {
        buttons[i].classList.add('disabled');
        if (i === q.correct_index) buttons[i].classList.add('reveal-correct');
      }

      if (isCorrect) {
        buttons[selectedIdx].classList.add('selected-correct');
        correctCount++;
        let qScore = 200;
        if (elapsedMs < 15000) {
          qScore += Math.floor(100 * ((15000 - elapsedMs) / 15000));
        }
        totalScore += qScore;
        document.getElementById('scoreBadge').innerText = `⭐ ${totalScore}`;
      } else {
        buttons[selectedIdx].classList.add('selected-wrong');
      }

      document.getElementById('explanationText').innerText = q.explanation || 'Отличный факт!';
      document.getElementById('explanationCard').style.display = 'block';
      document.getElementById('nextBtn').style.display = 'block';

      setTimeout(function () {
        document.getElementById('nextBtn').scrollIntoView({ behavior: 'smooth', block: 'end' });
      }, 120);

      fetch('/webapp/api/miniapp/trivia/submit_answer', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-TG-INIT-DATA': tg ? tg.initData : ''
        },
        body: JSON.stringify({
          question_index: currentIdx,
          selected_index: selectedIdx,
          is_correct: isCorrect,
          elapsed_ms: elapsedMs,
          total_score: totalScore,
          revision_id: puzzleRevisionId
        })
      }).catch(function () { });
    }

    function nextQuestion() {
      currentIdx++;
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showFinishScreen(alreadyDone) {
      document.getElementById('gameView').style.display = 'none';
      document.getElementById('superView').style.display = 'none';
      document.getElementById('progressFill').style.width = '100%';
      document.getElementById('finalScore').innerText = totalScore;
      document.getElementById('finalDetails').innerText =
        `Вы правильно ответили на ${correctCount} из ${questions.length} вопросов`;
      if (alreadyDone) {
        document.getElementById('alreadyDoneBadge').style.display = 'inline-block';
      }

      if (userSuperResult && userSuperResult.status === 'completed') {
        document.getElementById('superStartBtn').style.display = 'none';
        const doneBadge = document.getElementById('superDoneStatus');
        doneBadge.style.display = 'inline-block';
        const dStr = superDeltaScore >= 0 ? `+${superDeltaScore}` : `${superDeltaScore}`;
        doneBadge.innerText = `✓ Суперигра пройдена (${dStr} очков)`;
      } else {
        document.getElementById('superStartBtn').style.display = 'block';
        document.getElementById('superDoneStatus').style.display = 'none';
      }

      document.getElementById('finishView').style.display = 'block';
    }

    // --- Super Game Logic ---

    function startSuperGame() {
      if (userSuperResult && userSuperResult.status === 'completed') return;
      document.getElementById('finishView').style.display = 'none';
      document.getElementById('superView').style.display = 'block';
      currentSuperIdx = 0;
      superDeltaScore = 0;
      superCorrectCount = 0;
      updateSuperScoreBadge();
      renderSuperQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateSuperScoreBadge() {
      const badge = document.getElementById('scoreBadge');
      if (superDeltaScore === 0) {
        badge.innerText = `⭐ ${totalScore}`;
        badge.style.background = '';
        badge.style.color = '';
      } else if (superDeltaScore > 0) {
        badge.innerText = `⭐ ${totalScore} (+${superDeltaScore})`;
        badge.style.background = 'rgba(16,185,129,0.18)';
        badge.style.color = '#10b981';
      } else {
        badge.innerText = `⭐ ${totalScore} (${superDeltaScore})`;
        badge.style.background = 'rgba(244,63,94,0.18)';
        badge.style.color = '#f43f5e';
      }
    }

    function renderSuperQuestion() {
      if (currentSuperIdx >= superQuestions.length) {
        finishSuperGame();
        return;
      }

      answered = false;
      const q = superQuestions[currentSuperIdx];

      document.getElementById('qCounter').innerText = `Супервопрос ${currentSuperIdx + 1}/${superQuestions.length}`;
      document.getElementById('progressFill').style.width = `${((currentSuperIdx) / superQuestions.length) * 100}%`;
      document.getElementById('superTopicBadge').innerText = `⚡ ${q.topic || 'Суперигра'}`;
      document.getElementById('superQuestionText').innerText = q.question;
      document.getElementById('superExplanationCard').style.display = 'none';
      document.getElementById('superNextBtn').style.display = 'none';

      const grid = document.getElementById('superOptionsGrid');
      grid.innerHTML = '';

      q.options.forEach(function (optText, idx) {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = optText;
        btn.addEventListener('click', function () { selectSuperAnswer(idx); });
        grid.appendChild(btn);
      });

      startTime = Date.now();
    }

    function selectSuperAnswer(selectedIdx) {
      if (answered) return;
      answered = true;

      const elapsedMs = Date.now() - startTime;
      const q = superQuestions[currentSuperIdx];
      const isCorrect = (selectedIdx === q.correct_index);

      superPlayerAnswers[currentSuperIdx] = { selectedIdx: selectedIdx, isCorrect: isCorrect };

      const grid = document.getElementById('superOptionsGrid');
      const buttons = grid.children;

      for (let i = 0; i < buttons.length; i++) {
        buttons[i].classList.add('disabled');
        if (i === q.correct_index) buttons[i].classList.add('reveal-correct');
      }

      let baseScore = 200;
      if (elapsedMs < 15000) {
        baseScore += Math.floor(100 * ((15000 - elapsedMs) / 15000));
      }

      const qDelta = isCorrect ? (baseScore * 2) : (-baseScore * 2);

      if (isCorrect) {
        buttons[selectedIdx].classList.add('selected-correct');
        superCorrectCount++;
      } else {
        buttons[selectedIdx].classList.add('selected-wrong');
      }

      superDeltaScore += qDelta;
      updateSuperScoreBadge();

      document.getElementById('superExplanationText').innerText = q.explanation || 'Отличный факт!';
      document.getElementById('superExplanationCard').style.display = 'block';
      document.getElementById('superNextBtn').style.display = 'block';

      setTimeout(function () {
        document.getElementById('superNextBtn').scrollIntoView({ behavior: 'smooth', block: 'end' });
      }, 120);

      fetch('/webapp/api/miniapp/trivia/submit_super_answer', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-TG-INIT-DATA': tg ? tg.initData : ''
        },
        body: JSON.stringify({
          question_index: currentSuperIdx,
          selected_index: selectedIdx,
          is_correct: isCorrect,
          elapsed_ms: elapsedMs,
          base_score: baseScore,
          revision_id: puzzleRevisionId
        })
      }).catch(function () { });
    }

    function nextSuperQuestion() {
      currentSuperIdx++;
      renderSuperQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function finishSuperGame() {
      document.getElementById('superView').style.display = 'none';
      userSuperResult = { status: 'completed', delta_score: superDeltaScore, correct_count: superCorrectCount };

      totalScore = Math.max(0, totalScore + superDeltaScore);

      // Reset score badge to plain style showing final total
      const badge = document.getElementById('scoreBadge');
      badge.innerText = `⭐ ${totalScore}`;
      badge.style.background = '';
      badge.style.color = '';

      const dDisplay = document.getElementById('superDeltaDisplay');
      const dStr = superDeltaScore >= 0 ? `+${superDeltaScore}` : `${superDeltaScore}`;
      dDisplay.innerText = dStr;
      dDisplay.style.color = superDeltaScore >= 0 ? '#10b981' : '#f43f5e';

      document.getElementById('superFinishSubtitle').innerText =
        `Итоговый результат дня: ${totalScore} очков (${superCorrectCount}/3 в Суперигре)`;

      document.getElementById('superFinishView').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- Review Screen Logic ---

    function showReviewScreen() {
      document.getElementById('finishView').style.display = 'none';
      document.getElementById('superFinishView').style.display = 'none';
      buildAccordion();
      document.getElementById('reviewView').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function buildAccordion() {
      const container = document.getElementById('reviewAccordion');
      container.innerHTML = '';

      // 1. Regular 5 questions
      questions.forEach(function (q, idx) {
        const answer = playerAnswers[idx];
        const isCorrect = answer && answer.isCorrect;
        const selectedIdx = answer ? answer.selectedIdx : -1;

        const item = document.createElement('div');
        item.className = 'accordion-item ' + (isCorrect ? 'correct-item' : 'wrong-item');

        const trigger = document.createElement('button');
        trigger.className = 'accordion-trigger';

        const icon = document.createElement('span');
        icon.className = 'accordion-icon ' + (isCorrect ? 'icon-correct' : 'icon-wrong');
        icon.innerText = isCorrect ? '✓' : '✗';

        const qText = document.createElement('span');
        qText.className = 'accordion-question-text';
        qText.innerText = q.question;

        const chevron = document.createElement('span');
        chevron.className = 'accordion-chevron';
        chevron.innerHTML = '&#9660;';

        trigger.appendChild(icon);
        trigger.appendChild(qText);
        trigger.appendChild(chevron);
        trigger.addEventListener('click', function () {
          item.classList.toggle('open');
        });

        const body = document.createElement('div');
        body.className = 'accordion-body';

        const optsList = document.createElement('div');
        optsList.className = 'review-options';

        q.options.forEach(function (optText, optIdx) {
          const opt = document.createElement('div');
          opt.className = 'review-option';
          if (optIdx === q.correct_index) {
            opt.classList.add('ro-correct');
            opt.innerText = '✓ ' + optText;
          } else if (optIdx === selectedIdx && !isCorrect) {
            opt.classList.add('ro-wrong-selected');
            opt.innerText = '✗ ' + optText;
          } else {
            opt.classList.add('ro-neutral');
            opt.innerText = optText;
          }
          optsList.appendChild(opt);
        });
        body.appendChild(optsList);

        if (q.explanation) {
          const factBox = document.createElement('div');
          factBox.className = 'review-fact';
          const factLabel = document.createElement('div');
          factLabel.className = 'review-fact-label';
          factLabel.innerText = '💡 Знаете ли вы?';
          const factBody = document.createElement('div');
          factBody.className = 'review-fact-body';
          factBody.innerText = q.explanation;
          factBox.appendChild(factLabel);
          factBox.appendChild(factBody);
          body.appendChild(factBox);
        }

        if (BOT_USERNAME && puzzleDate) {
          const deepLink = 'https://t.me/' + BOT_USERNAME + '?start=trivia_q_' + puzzleDate.replace(/-/g, '') + '_' + idx;
          const aiBtn = document.createElement('a');
          aiBtn.href = deepLink;
          aiBtn.className = 'btn-ai-more';
          aiBtn.target = '_blank';
          aiBtn.rel = 'noopener noreferrer';
          aiBtn.innerHTML = '🤖 Узнать больше';
          aiBtn.addEventListener('click', function (e) {
            e.preventDefault();
            if (tg && tg.openTelegramLink) {
              tg.openTelegramLink(deepLink);
            } else {
              window.open(deepLink, '_blank');
            }
          });
          body.appendChild(aiBtn);
        }

        item.appendChild(trigger);
        item.appendChild(body);
        container.appendChild(item);
      });

      // 2. Super Game Divider
      const divContainer = document.createElement('div');
      divContainer.className = 'super-divider';
      divContainer.innerHTML = '<div class="super-divider-line"></div><div class="super-divider-text super-title">⚡ СУПЕРИГРА</div><div class="super-divider-line"></div>';
      container.appendChild(divContainer);

      // 3. Super Game Section (Locked or Accordion)
      const isSuperCompleted = userSuperResult && userSuperResult.status === 'completed';

      if (!isSuperCompleted) {
        const lockBox = document.createElement('div');
        lockBox.className = 'super-locked-box';
        lockBox.innerHTML = `
          <div style="font-size: 2rem; margin-bottom: 8px;">🔒</div>
          <div class="super-locked-text">Пройдите Суперигру, чтобы открыть разбор этих вопросов!</div>
        `;
        const lockBtn = document.createElement('button');
        lockBtn.className = 'btn-super';
        lockBtn.style.padding = '12px 20px';
        lockBtn.innerText = '⚡ Сыграть Суперигру';
        lockBtn.addEventListener('click', function () {
          document.getElementById('reviewView').style.display = 'none';
          startSuperGame();
        });
        lockBox.appendChild(lockBtn);
        container.appendChild(lockBox);
      } else {
        superQuestions.forEach(function (sq, sIdx) {
          const answer = superPlayerAnswers[sIdx];
          const isCorrect = answer && answer.isCorrect;
          const selectedIdx = answer ? answer.selectedIdx : -1;

          const item = document.createElement('div');
          item.className = 'accordion-item ' + (isCorrect ? 'correct-item' : 'wrong-item');
          item.style.borderColor = isCorrect ? 'rgba(255, 0, 128, 0.4)' : 'rgba(244, 63, 94, 0.4)';

          const trigger = document.createElement('button');
          trigger.className = 'accordion-trigger';

          const icon = document.createElement('span');
          icon.className = 'accordion-icon ' + (isCorrect ? 'icon-correct' : 'icon-wrong');
          icon.innerText = isCorrect ? '✓' : '✗';

          const qText = document.createElement('span');
          qText.className = 'accordion-question-text';
          qText.innerText = `[⚡] ${sq.question}`;

          const chevron = document.createElement('span');
          chevron.className = 'accordion-chevron';
          chevron.innerHTML = '&#9660;';

          trigger.appendChild(icon);
          trigger.appendChild(qText);
          trigger.appendChild(chevron);
          trigger.addEventListener('click', function () {
            item.classList.toggle('open');
          });

          const body = document.createElement('div');
          body.className = 'accordion-body';

          const optsList = document.createElement('div');
          optsList.className = 'review-options';

          sq.options.forEach(function (optText, optIdx) {
            const opt = document.createElement('div');
            opt.className = 'review-option';
            if (optIdx === sq.correct_index) {
              opt.classList.add('ro-correct');
              opt.innerText = '✓ ' + optText;
            } else if (optIdx === selectedIdx && !isCorrect) {
              opt.classList.add('ro-wrong-selected');
              opt.innerText = '✗ ' + optText;
            } else {
              opt.classList.add('ro-neutral');
              opt.innerText = optText;
            }
            optsList.appendChild(opt);
          });
          body.appendChild(optsList);

          if (sq.explanation) {
            const factBox = document.createElement('div');
            factBox.className = 'review-fact';
            factBox.style.borderColor = 'rgba(255, 0, 128, 0.3)';
            factBox.style.background = 'rgba(255, 0, 128, 0.05)';
            const factLabel = document.createElement('div');
            factLabel.className = 'review-fact-label';
            factLabel.style.color = '#ff80bf';
            factLabel.innerText = '💡 Знаете ли вы?';
            const factBody = document.createElement('div');
            factBody.className = 'review-fact-body';
            factBody.innerText = sq.explanation;
            factBox.appendChild(factLabel);
            factBox.appendChild(factBody);
            body.appendChild(factBox);
          }

          if (BOT_USERNAME && puzzleDate) {
            const deepLink = 'https://t.me/' + BOT_USERNAME + '?start=trivia_q_' + puzzleDate.replace(/-/g, '') + '_s' + sIdx;
            const aiBtn = document.createElement('a');
            aiBtn.href = deepLink;
            aiBtn.className = 'btn-ai-more';
            aiBtn.style.borderColor = 'rgba(255, 0, 128, 0.4)';
            aiBtn.style.color = '#ff80bf';
            aiBtn.target = '_blank';
            aiBtn.rel = 'noopener noreferrer';
            aiBtn.innerHTML = '🤖 Узнать больше';
            aiBtn.addEventListener('click', function (e) {
              e.preventDefault();
              if (tg && tg.openTelegramLink) {
                tg.openTelegramLink(deepLink);
              } else {
                window.open(deepLink, '_blank');
              }
            });
            body.appendChild(aiBtn);
          }

          item.appendChild(trigger);
          item.appendChild(body);
          container.appendChild(item);
        });
      }
    }

    defInit();
  </script>
</body>

</html>
