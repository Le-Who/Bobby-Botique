<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>🎙️ Live AI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg:          #0a0d14;
      --surface:     rgba(255,255,255,0.06);
      --surface-alt: rgba(255,255,255,0.10);
      --border:      rgba(255,255,255,0.10);
      --accent:      #00e0ff;
      --accent-warm: #ff6b6b;
      --accent-ok:   #00e096;
      --text:        #e8eaf0;
      --text-dim:    rgba(232,234,240,0.55);
      --blur:        blur(20px);
      --radius:      16px;
      --font:        'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100dvh;
      gap: 18px;
      padding: 24px 24px 28px;
    }

    #top-bar {
      width: 100%;
      max-width: 420px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    #settings-summary {
      flex: 1;
      min-width: 0;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #settings-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ── Status section ─────────────────────────────────────────────── */
    #status-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-dim);
      text-align: center;
      min-height: 20px;
      transition: color .3s;
    }
    #status-label.active { color: var(--accent-ok); }
    #status-label.error  { color: var(--accent-warm); }

    /* ── Waveform visualizer ────────────────────────────────────────── */
    #visualizer-wrap {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, rgba(0,224,255,.08) 0%, transparent 70%);
      position: relative;
    }

    #visualizer-wrap.recording {
      animation: pulse-ring 2s ease-in-out infinite;
    }
    #visualizer-wrap.connecting {
      animation: pulse-ring 1s ease-in-out infinite;
      filter: hue-rotate(45deg);
    }
    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0,224,255,.25); }
      50%      { box-shadow: 0 0 0 24px rgba(0,224,255,.0); }
    }

    canvas#visualizer {
      width: 180px;
      height: 180px;
      border-radius: 50%;
    }

    /* ── Transcript feed ────────────────────────────────────────────── */
    #transcript-area {
      width: 100%;
      max-width: 420px;
      min-height: clamp(120px, 22dvh, 180px);
      max-height: min(30dvh, 260px);
      overflow-x: hidden;
      overflow-y: auto;
      padding: 14px 16px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      font-size: 15px;
      line-height: 1.55;
      color: var(--text-dim);
      text-align: left;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }
    #transcript-area:empty::after {
      content: "Транскрипт появится здесь…";
      opacity: .5;
    }

    .t-user { color: var(--accent); font-weight: 500; }
    .t-ai   { color: var(--text); }

    #transcript-area p + p {
      margin-top: 10px;
    }

    /* ── Controls ───────────────────────────────────────────────────── */
    #controls {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .ctrl-btn {
      width: 64px; height: 64px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      transition: transform .15s, box-shadow .15s;
      flex-shrink: 0;
    }
    .ctrl-btn:active { transform: scale(.88); }
    .ctrl-btn:disabled { opacity: .3; cursor: not-allowed; transform: none; }

    #mic-btn {
      background: linear-gradient(135deg, var(--accent), #6d72ff);
      color: #000;
      box-shadow: 0 4px 20px rgba(0,224,255,.35);
    }
    #mic-btn.recording {
      background: linear-gradient(135deg, var(--accent-warm), #ff9f43);
      box-shadow: 0 4px 20px rgba(255,107,107,.35);
    }

    #end-btn {
      width: 48px; height: 48px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 20px;
    }

    /* ── Error bar ──────────────────────────────────────────────────── */
    #error-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 12px 20px;
      padding-bottom: max(12px, env(safe-area-inset-bottom, 12px));
      background: rgba(255,107,107,.14);
      border-top: 1px solid rgba(255,107,107,.3);
      color: var(--accent-warm);
      font-size: 13px; text-align: center;
      transform: translateY(100%);
      transition: transform .3s;
      z-index: 30;
    }
    #error-bar.show { transform: translateY(0); }

    #sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 10, 18, 0.66);
      backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
      z-index: 40;
    }
    #sheet-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    #live-settings-sheet {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      max-width: 440px;
      max-height: min(78dvh, 720px);
      margin: 0 auto;
      padding: 18px;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: rgba(14, 19, 31, 0.96);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.38);
      transform: translateY(110%);
      transition: transform .22s ease;
      z-index: 45;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #live-settings-sheet.show { transform: translateY(0); }

    .sheet-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding-right: 4px;
      margin-right: -4px;
      touch-action: pan-y;
    }

    .sheet-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .sheet-subtitle {
      color: var(--text-dim);
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 18px;
    }

    .sheet-section-title {
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 10px;
    }

    .settings-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .settings-group {
      margin-bottom: 14px;
    }

    .settings-group:last-child {
      margin-bottom: 0;
    }

    .settings-group-label {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .sheet-option {
      width: 100%;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }
    .sheet-option.active {
      border-color: rgba(0, 224, 255, 0.52);
      background: rgba(0, 224, 255, 0.12);
      box-shadow: inset 0 0 0 1px rgba(0, 224, 255, 0.16);
    }

    .sheet-option-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .sheet-option-hint {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.45;
    }

    .sheet-actions {
      display: flex;
      gap: 10px;
    }

    .sheet-action-btn {
      flex: 1;
      min-height: 46px;
      border-radius: 14px;
      border: 1px solid var(--border);
      cursor: pointer;
      font-weight: 600;
    }

    #live-settings-cancel {
      background: transparent;
      color: var(--text-dim);
    }

    #live-settings-save {
      background: linear-gradient(135deg, var(--accent), #6d72ff);
      color: #061018;
      border: none;
    }

    @media (max-height: 760px) {
      #app {
        gap: 14px;
        padding-top: 18px;
        padding-bottom: 20px;
      }

      #visualizer-wrap {
        width: 190px;
        height: 190px;
      }

      canvas#visualizer {
        width: 156px;
        height: 156px;
      }

      #transcript-area {
        min-height: clamp(132px, 26dvh, 190px);
        max-height: min(34dvh, 280px);
      }
    }

    @media (max-height: 680px) {
      #top-bar {
        max-width: 100%;
      }

      #visualizer-wrap {
        width: 168px;
        height: 168px;
      }

      canvas#visualizer {
        width: 136px;
        height: 136px;
      }

      #transcript-area {
        min-height: clamp(144px, 30dvh, 210px);
        max-height: min(38dvh, 320px);
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

<div id="app">
  <div id="top-bar">
    <div id="settings-summary">Live: Standard · Aoede · Сбалансированный</div>
    <button id="settings-btn" type="button" title="Настройки live">⚙️</button>
  </div>

  <div id="status-label">Нажмите 🎙️ чтобы начать</div>

  <div id="visualizer-wrap">
    <canvas id="visualizer" width="180" height="180"></canvas>
  </div>

  <div id="transcript-area"></div>

  <div id="controls">
    <button id="end-btn" class="ctrl-btn" title="Завершить" disabled>✕</button>
    <button id="mic-btn" class="ctrl-btn" title="Начать запись" id="mic-btn">🎙️</button>
  </div>
</div>

<div id="error-bar"></div>
<div id="sheet-overlay"></div>
<div id="live-settings-sheet">
  <div class="sheet-scroll">
    <div class="sheet-title">Настройки Live Audio</div>
    <div class="sheet-subtitle">
      Эти параметры относятся только к live-диалогу. Обычный TTS-голос не меняется.
      Изменения применяются через короткое переподключение.
    </div>

    <div class="sheet-section-title">Подключение</div>
    <div id="live-connection-modes" class="settings-list"></div>

    <div class="sheet-section-title">Голос</div>
    <div id="live-voice-options" class="settings-list"></div>

    <div class="sheet-section-title">Режим мышления</div>
    <div id="live-thinking-options" class="settings-list"></div>
  </div>

  <div class="sheet-actions">
    <button id="live-settings-cancel" class="sheet-action-btn" type="button">Отмена</button>
    <button id="live-settings-save" class="sheet-action-btn" type="button">Сохранить</button>
  </div>
</div>

<script>
/* ── Telegram WebApp ────────────────────────────────────────────────── */
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor?.('#0a0d14');
  tg.setBackgroundColor?.('#0a0d14');
}
const haptic = tg?.HapticFeedback;
const INIT_DATA = tg?.initData || '';

/* ── DOM refs ───────────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const statusEl    = $('status-label');
const micBtn      = $('mic-btn');
const endBtn      = $('end-btn');
const vizWrap     = $('visualizer-wrap');
const canvas      = $('visualizer');
const ctx         = canvas.getContext('2d');
const transcriptEl = $('transcript-area');
const settingsBtn = $('settings-btn');
const settingsSummaryEl = $('settings-summary');
const sheetOverlay = $('sheet-overlay');
const liveSettingsSheet = $('live-settings-sheet');
const liveConnectionModesEl = $('live-connection-modes');
const liveVoiceOptionsEl = $('live-voice-options');
const liveThinkingOptionsEl = $('live-thinking-options');
const liveSettingsCancelBtn = $('live-settings-cancel');
const liveSettingsSaveBtn = $('live-settings-save');
const errorBar    = $('error-bar');

/* ── State ──────────────────────────────────────────────────────────── */
let ws = null;
let recording = false;
let audioCtx = null;
let workletNode = null;
let micStream = null;
let playbackCtx = null;
let scheduledSources = [];
let nextPlaybackTime = 0;
let resumptionToken = sessionStorage.getItem('liveResumptionToken') || '';
let sessionEndedIntentionally = false;
let reconnectTimer = null;
let liveFatalState = null;
let plannedReconnect = false;
let liveSettings = { live_connection_mode: 'standard', live_voice_name: 'Aoede', live_thinking_level: 'low' };
let draftLiveSettings = { ...liveSettings };
let liveConnectionModes = [];
let liveVoiceOptions = [];
let liveThinkingOptions = [];
let controlledReconnectState = null;
let activeConnectionMode = 'standard';
let sessionConnectionModeOverride = null;
let pendingModeFallback = null;
let pendingModeFallbackMessage = '';
let modeFallbackUsed = false;
let liveSessionEstablished = false;
let pendingRecordingStart = false;

/* ── Reconnect: exponential backoff ────────────────────────────────── */
const BACKOFF_BASE_MS = 500;
const BACKOFF_MAX_MS  = 8000;
let reconnectAttempt = 0;
const LIVE_THINKING_LABELS = {
  off: 'Быстрый',
  low: 'Сбалансированный',
  medium: 'Умный'
};
const LIVE_MODE_LABELS = {
  standard: 'Standard',
  vertex_internet: 'Internet'
};

function _backoffDelay() {
  const base = Math.min(BACKOFF_BASE_MS * Math.pow(2, reconnectAttempt), BACKOFF_MAX_MS);
  return base + Math.random() * 500;  // jitter
}

function esc(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

async function api(path, options = {}) {
  const headers = {
    Authorization: `tma ${INIT_DATA}`,
    ...(options.body ? { 'Content-Type': 'application/json' } : {}),
    ...(options.headers || {})
  };
  const response = await fetch(`/webapp/api${path}`, {
    method: options.method || 'GET',
    headers,
    body: options.body,
    keepalive: options.keepalive ?? false
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) {
    throw new Error(payload.error || `HTTP ${response.status}`);
  }
  return payload;
}

function renderSettingsSummary() {
  const connectionMode = LIVE_MODE_LABELS[liveSettings.live_connection_mode] || 'Standard';
  const voice = liveSettings.live_voice_name || 'Aoede';
  const thinking = LIVE_THINKING_LABELS[liveSettings.live_thinking_level] || 'Сбалансированный';
  settingsSummaryEl.textContent = `Live: ${connectionMode} · ${voice} · ${thinking}`;
}

function renderLiveSettingOptions() {
  liveConnectionModesEl.innerHTML = liveConnectionModes.map((mode) => {
    const active = draftLiveSettings.live_connection_mode === mode.id;
    return `
      <button type="button" class="sheet-option ${active ? 'active' : ''}" data-live-connection-mode="${esc(mode.id)}">
        <div class="sheet-option-title">
          <span>${esc(mode.label)}</span>
          <span>${active ? '✓' : ''}</span>
        </div>
        <div class="sheet-option-hint">${esc(mode.summary || '')}</div>
      </button>
    `;
  }).join('');

  const voiceGroups = [
    { id: 'female', label: 'Женские' },
    { id: 'male', label: 'Мужские' }
  ];
  liveVoiceOptionsEl.innerHTML = voiceGroups.map((group) => {
    const groupVoices = liveVoiceOptions.filter((voice) => voice.gender === group.id);
    if (!groupVoices.length) return '';
    const optionsHtml = groupVoices.map((voice) => {
      const active = draftLiveSettings.live_voice_name === voice.id;
      return `
        <button type="button" class="sheet-option ${active ? 'active' : ''}" data-live-voice="${esc(voice.id)}">
          <div class="sheet-option-title">
            <span>${esc(voice.name)}</span>
            <span>${active ? '✓' : ''}</span>
          </div>
          <div class="sheet-option-hint">${esc(voice.description || '')}</div>
        </button>
      `;
    }).join('');
    return `
      <div class="settings-group" data-voice-group="${esc(group.id)}">
        <div class="settings-group-label">${esc(group.label)}</div>
        <div class="settings-list">${optionsHtml}</div>
      </div>
    `;
  }).join('');

  liveThinkingOptionsEl.innerHTML = liveThinkingOptions.map((preset) => {
    const active = draftLiveSettings.live_thinking_level === preset.id;
    return `
      <button type="button" class="sheet-option ${active ? 'active' : ''}" data-live-thinking="${esc(preset.id)}">
        <div class="sheet-option-title">
          <span>${esc(preset.label)}</span>
          <span>${active ? '✓' : ''}</span>
        </div>
        <div class="sheet-option-hint">${esc(preset.hint || '')}</div>
      </button>
    `;
  }).join('');
}

function openLiveSettingsSheet() {
  draftLiveSettings = { ...liveSettings };
  renderLiveSettingOptions();
  sheetOverlay.classList.add('show');
  liveSettingsSheet.classList.add('show');
}

function closeLiveSettingsSheet() {
  sheetOverlay.classList.remove('show');
  liveSettingsSheet.classList.remove('show');
}

async function loadLiveSettings() {
  const payload = await api('/live-settings');
  liveSettings = {
    live_connection_mode: payload.live_settings?.live_connection_mode || 'standard',
    live_voice_name: payload.live_settings?.live_voice_name || 'Aoede',
    live_thinking_level: payload.live_settings?.live_thinking_level || 'low'
  };
  draftLiveSettings = { ...liveSettings };
  liveConnectionModes = payload.connection_modes || [];
  liveVoiceOptions = payload.voices || [];
  liveThinkingOptions = payload.thinking_presets || [];
  renderSettingsSummary();
  renderLiveSettingOptions();
}

function requestSettingsReconnect() {
  const hasLiveSession = Boolean(ws) || recording || !endBtn.disabled;
  if (!hasLiveSession) {
    setStatus('Настройки сохранены. Они применятся при следующем подключении.', '');
    return;
  }

  controlledReconnectState = {
    source: 'live_settings',
    restoreRecording: recording,
    triedFreshFallback: false,
    needsFreshFallback: false
  };
  clearTimeout(reconnectTimer);
  reconnectAttempt = 0;
  sessionEndedIntentionally = false;
  liveFatalState = null;
  flushPlayback();
  if (recording) {
    stopRecording({ preserveStatus: true });
  }
  setStatus('Применяю новые настройки…', '');
  vizWrap.classList.add('connecting');

  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
    plannedReconnect = true;
    ws.close(1000, 'settings-updated');
    return;
  }
  connectWS();
}

async function saveLiveSettings() {
  const changed =
    draftLiveSettings.live_connection_mode !== liveSettings.live_connection_mode ||
    draftLiveSettings.live_voice_name !== liveSettings.live_voice_name ||
    draftLiveSettings.live_thinking_level !== liveSettings.live_thinking_level;
  if (!changed) {
    closeLiveSettingsSheet();
    return;
  }

  liveSettingsSaveBtn.disabled = true;
  try {
    const payload = await api('/live-settings', {
      method: 'PATCH',
      body: JSON.stringify(draftLiveSettings)
    });
    liveSettings = {
      live_connection_mode: payload.live_settings?.live_connection_mode || draftLiveSettings.live_connection_mode,
      live_voice_name: payload.live_settings?.live_voice_name || draftLiveSettings.live_voice_name,
      live_thinking_level: payload.live_settings?.live_thinking_level || draftLiveSettings.live_thinking_level
    };
    draftLiveSettings = { ...liveSettings };
    sessionConnectionModeOverride = null;
    pendingModeFallback = null;
    pendingModeFallbackMessage = '';
    modeFallbackUsed = false;
    liveSessionEstablished = false;
    resumptionToken = '';
    sessionStorage.removeItem('liveResumptionToken');
    renderSettingsSummary();
    renderLiveSettingOptions();
    closeLiveSettingsSheet();
    requestSettingsReconnect();
  } catch (err) {
    showError('Не удалось сохранить настройки live');
  } finally {
    liveSettingsSaveBtn.disabled = false;
  }
}



/* ── Error bar ──────────────────────────────────────────────────────── */
function showError(msg) {
  haptic?.notificationOccurred('error');
  errorBar.textContent = msg;
  errorBar.classList.add('show');
  setTimeout(() => errorBar.classList.remove('show'), 4000);
}

function setStatus(text, cls = '') {
  let icon = '';
  if (cls === 'active') icon = '🟢 ';
  else if (cls === 'error') icon = '🔴 ';
  else icon = '⏳ ';

  statusEl.textContent = icon + text;
  statusEl.className = cls;
  if (cls === 'error') haptic?.notificationOccurred('warning');
  if (cls === 'active') haptic?.notificationOccurred('success');
}

/* ── Visualizer ─────────────────────────────────────────────────────── */
let vizAnimId = null;
let vizAnalyser = null;

function startViz(analyser) {
  vizAnalyser = analyser;
  const bufLen = analyser.frequencyBinCount;
  const dataArr = new Uint8Array(bufLen);

  function draw() {
    vizAnimId = requestAnimationFrame(draw);
    analyser.getByteFrequencyData(dataArr);

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const bars = 48;
    const maxR = 80;
    const minR = 30;

    for (let i = 0; i < bars; i++) {
      const idx = Math.floor(i * bufLen / bars);
      const v = dataArr[idx] / 255;
      const angle = (i / bars) * Math.PI * 2 - Math.PI / 2;
      const r0 = minR;
      const r1 = minR + v * (maxR - minR);

      ctx.beginPath();
      ctx.moveTo(cx + r0 * Math.cos(angle), cy + r0 * Math.sin(angle));
      ctx.lineTo(cx + r1 * Math.cos(angle), cy + r1 * Math.sin(angle));
      ctx.strokeStyle = `hsl(${180 + v * 60}, 100%, ${50 + v * 30}%)`;
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.stroke();
    }
  }
  draw();
}

function stopViz() {
  if (vizAnimId) cancelAnimationFrame(vizAnimId);
  vizAnimId = null;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

/* ── Playback (PCM 24kHz from Gemini → AudioContext) ────────────────── */
function initPlayback() {
  if (!playbackCtx) {
    playbackCtx = new AudioContext({ sampleRate: 24000 });
  }
}

function enqueueAudio(base64Pcm) {
  const raw = atob(base64Pcm);
  const bytes = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  const int16 = new Int16Array(bytes.buffer);
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) {
    float32[i] = int16[i] / 32768;
  }

  const buf = playbackCtx.createBuffer(1, float32.length, 24000);
  buf.getChannelData(0).set(float32);
  
  if (playbackCtx.state !== 'running') {
    playbackCtx.resume();
  }

  const now = playbackCtx.currentTime;
  if (nextPlaybackTime < now) {
    nextPlaybackTime = now;
  }

  const src = playbackCtx.createBufferSource();
  src.buffer = buf;
  src.connect(playbackCtx.destination);
  src.start(nextPlaybackTime);
  
  nextPlaybackTime += buf.duration;
  
  scheduledSources.push(src);
  src.onended = () => {
    const idx = scheduledSources.indexOf(src);
    if (idx > -1) scheduledSources.splice(idx, 1);
  };
}

function flushPlayback() {
  scheduledSources.forEach(src => {
    try { src.stop(); } catch (e) {}
  });
  scheduledSources = [];
  nextPlaybackTime = 0;
}

/* ── WebSocket to Quart proxy ───────────────────────────────────────── */
function resolveSocketPath(mode) {
  return mode === 'vertex_internet' ? '/webapp/live-vertex/ws' : '/webapp/live/ws';
}

function maybeQueueStandardFallback(reason, message) {
  if (activeConnectionMode !== 'vertex_internet' || liveSessionEstablished || modeFallbackUsed) {
    return false;
  }
  modeFallbackUsed = true;
  sessionConnectionModeOverride = 'standard';
  pendingModeFallback = 'standard';
  pendingModeFallbackMessage = message || reason || 'Internet-режим недоступен, переключаю на стандартный Live.';
  liveFatalState = null;
  sessionEndedIntentionally = false;
  return true;
}

function connectWS(options = {}) {
  if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) {
    return;
  }

  clearTimeout(reconnectTimer);
  plannedReconnect = false;
  liveSessionEstablished = false;

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const enc = encodeURIComponent(INIT_DATA);
  const connectionMode = options.mode || sessionConnectionModeOverride || liveSettings.live_connection_mode || 'standard';
  activeConnectionMode = connectionMode;
  let url = `${proto}://${location.host}${resolveSocketPath(connectionMode)}?initData=${enc}`;
  if (resumptionToken) {
    url += `&resumptionToken=${encodeURIComponent(resumptionToken)}`;
  }

  setStatus(reconnectAttempt > 0
    ? `Переподключение… (${reconnectAttempt})`
    : 'Подключаюсь к AI…', '');
  
  vizWrap.classList.add('connecting');

  const socket = new WebSocket(url);
  ws = socket;

  socket.onopen = () => {
    if (ws !== socket) return;
    reconnectAttempt = 0;       // reset backoff on success
    vizWrap.classList.remove('connecting');
    if (recording || pendingRecordingStart) {
      setStatus('Подключено к AI. Запускаю микрофон…', '');
    } else {
      setStatus('Подключение активно. Нажмите 🎙️ чтобы говорить.', '');
    }
    endBtn.disabled = false;
  };

  socket.onmessage = (ev) => {
    if (ws !== socket) return;
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }

    switch (msg.type) {
      case 'connected':
        liveSessionEstablished = true;
        pendingModeFallback = null;
        if (pendingRecordingStart && !recording) {
          pendingRecordingStart = false;
          setStatus('Микрофон готовится…', '');
          void startMicCapture();
        } else if (controlledReconnectState?.restoreRecording && !recording) {
          controlledReconnectState = null;
          setStatus('Настройки применены. Возвращаю микрофон…', '');
          void startMicCapture();
        } else if (recording && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'activity_start' }));
          setStatus('Соединение восстановлено. Продолжайте говорить.', 'active');
        } else if (controlledReconnectState) {
          controlledReconnectState = null;
          setStatus('Настройки применены.', 'active');
        } else if (sessionConnectionModeOverride === 'standard' && activeConnectionMode === 'standard') {
          setStatus('Подключено к стандартному Live после fallback.', 'active');
        } else if (!recording) {
          setStatus('Подключение активно. Нажмите 🎙️ чтобы говорить.', '');
        }
        break;

      case 'audio':
        initPlayback();
        enqueueAudio(msg.data);
        break;

      case 'interrupt':
        flushPlayback();
        break;

      case 'input_transcript':
        appendTranscript('Вы', msg.text, 't-user');
        break;

      case 'output_transcript':
        appendTranscript('AI', msg.text, 't-ai');
        break;

      case 'resumption_token':
        if (msg.token) {
          resumptionToken = msg.token;
          sessionStorage.setItem('liveResumptionToken', resumptionToken);
        }
        break;

      case 'go_away': {
        // Server will disconnect soon — proactively reconnect.
        const leadMs = Math.max((msg.time_left_seconds || 60) - 5, 1) * 1000;
        console.log(`[live] GoAway: reconnecting proactively in ${leadMs}ms`);
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(() => {
          if (!sessionEndedIntentionally && ws === socket) {
            plannedReconnect = true;
            socket.close(1000, 'proactive-goaway');
          }
        }, leadMs);
        break;
      }

      case 'session_resumed':
        break;

      case 'fatal':
        if (
          (msg.reason === 'misconfigured' || msg.reason === 'server_capacity') &&
          maybeQueueStandardFallback(msg.reason, 'Internet-режим недоступен. Переключаю на стандартный Live.')
        ) {
          if (recording) {
            stopRecording({ preserveStatus: true });
          }
          if (ws === socket && socket.readyState === WebSocket.OPEN) {
            socket.close(1000, 'vertex-fallback');
          }
          break;
        }
        liveFatalState = msg.reason || 'fatal';
        clearTimeout(reconnectTimer);
        if (recording) {
          stopRecording({ preserveStatus: true });
        }
        sessionEndedIntentionally = true;
        endBtn.disabled = true;
        setStatus(msg.message || 'Голосовой режим временно недоступен', 'error');
        showError(msg.message || 'Голосовой режим временно недоступен');
        if (ws === socket && socket.readyState === WebSocket.OPEN) {
          socket.close(1000, 'fatal');
        }
        break;

      case 'error':
        if (
          msg.reason === 'connect_failed' &&
          maybeQueueStandardFallback(msg.reason, 'Не удалось запустить internet-live. Переключаю на стандартный Live.')
        ) {
          if (ws === socket && socket.readyState === WebSocket.OPEN) {
            socket.close(1000, 'vertex-connect-failed');
          }
          break;
        }
        if (
          controlledReconnectState &&
          !controlledReconnectState.triedFreshFallback &&
          resumptionToken &&
          msg.reason === 'connect_failed'
        ) {
          controlledReconnectState.needsFreshFallback = true;
        }
        showError(msg.message || 'Ошибка сервера');
        break;
    }
  };

  socket.onclose = () => {
    if (ws === socket) {
      ws = null;
    } else {
      return;
    }

    if (sessionEndedIntentionally) {
      if (liveFatalState) {
        setStatus('Голосовой режим временно недоступен', 'error');
      } else {
        setStatus('Сессия завершена', 'error');
      }
      return;
    }

    if (controlledReconnectState?.needsFreshFallback && !controlledReconnectState.triedFreshFallback) {
      controlledReconnectState.triedFreshFallback = true;
      controlledReconnectState.needsFreshFallback = false;
      resumptionToken = '';
      sessionStorage.removeItem('liveResumptionToken');
      plannedReconnect = false;
      setStatus('Обновляю сессию без старого контекста…', '');
      vizWrap.classList.add('connecting');
      connectWS();
      return;
    }

    if (pendingModeFallback) {
      const fallbackMode = pendingModeFallback;
      pendingModeFallback = null;
      const fallbackMessage = pendingModeFallbackMessage;
      pendingModeFallbackMessage = '';
      resumptionToken = '';
      sessionStorage.removeItem('liveResumptionToken');
      plannedReconnect = false;
      showError(fallbackMessage || 'Internet-режим недоступен. Переключаю на стандартный Live.');
      setStatus('Переключаю на стандартный Live…', '');
      vizWrap.classList.add('connecting');
      connectWS({ mode: fallbackMode });
      return;
    }

    if (plannedReconnect) {
      plannedReconnect = false;
      setStatus('Восстанавливаю сессию…', '');
      vizWrap.classList.add('connecting');
      connectWS();
      return;
    }
    
    setStatus('Потеряно соединение. Восстанавливаем...', 'error');
    vizWrap.classList.add('connecting');
    if (recording) {
      // Mic stays active, but outbound chunks pause until the session reconnects.
      stopViz();
    }
    
    // Exponential backoff reconnect
    const delay = _backoffDelay();
    reconnectAttempt++;
    console.log(`[live] reconnecting in ${Math.round(delay)}ms (attempt ${reconnectAttempt})`);
    reconnectTimer = setTimeout(() => {
      if (!sessionEndedIntentionally) {
        connectWS();
      }
    }, delay);
  };

  socket.onerror = () => {};
}

/* ── Transcript ─────────────────────────────────────────────────────── */
function appendTranscript(who, text, cls) {
  if (!text) return;
  const lastP = transcriptEl.lastElementChild;
  if (lastP && lastP.className === cls) {
    lastP.textContent += ` ${text}`;
  } else {
    const p = document.createElement('p');
    p.className = cls;
    p.textContent = `${who}: ${text}`;
    transcriptEl.appendChild(p);
  }
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

/* ── Mic capture via AudioWorklet ───────────────────────────────────── */
async function startMicCapture() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, sampleRate: 16000 }
    });
  } catch (err) {
    showError('Нет доступа к микрофону');
    return;
  }

  audioCtx = new AudioContext({ sampleRate: 48000 });
  const source = audioCtx.createMediaStreamSource(micStream);

  // Analyser for visualizer
  const analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  source.connect(analyser);

  // AudioWorklet
  try {
    await audioCtx.audioWorklet.addModule('/static/js/audio-processor.js');
    workletNode = new AudioWorkletNode(audioCtx, 'mic-processor');
    workletNode.port.onmessage = (ev) => {
      if (!recording || !ws || ws.readyState !== WebSocket.OPEN) return;
      const b64 = arrayBufferToBase64(ev.data);
      ws.send(JSON.stringify({
        type: 'realtime_input',
        mime_type: 'audio/pcm;rate=16000',
        data: b64
      }));
    };
    source.connect(workletNode);
    workletNode.connect(audioCtx.destination);
  } catch (err) {
    showError('AudioWorklet не поддерживается в этом браузере');
    return;
  }

  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'activity_start' }));
  }

  recording = true;
  micBtn.classList.add('recording');
  micBtn.textContent = '⏸️';
  vizWrap.classList.add('recording');
  startViz(analyser);
  setStatus('Слушаю…', 'active');
  haptic?.impactOccurred('medium');

}

function startRecording() {
  sessionEndedIntentionally = false;
  liveFatalState = null;
  pendingRecordingStart = false;

  if (liveSessionEstablished && ws && ws.readyState === WebSocket.OPEN) {
    void startMicCapture();
    return;
  }

  pendingRecordingStart = true;
  connectWS();
  setStatus('Подключаю микрофон…', '');
  vizWrap.classList.add('connecting');
}

function stopRecording({ preserveStatus = false } = {}) {
  const cancelPendingStart = pendingRecordingStart && !recording;
  pendingRecordingStart = false;
  if (!recording && !cancelPendingStart) {
    return;
  }
  recording = false;
  micBtn.classList.remove('recording');
  micBtn.textContent = '🎙️';
  vizWrap.classList.remove('recording');
  vizWrap.classList.remove('connecting');
  stopViz();

  // Explicit push-to-talk boundary while keeping the websocket session alive.
  if (!cancelPendingStart && ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'activity_end' }));
  }

  // Cleanup mic only
  if (workletNode) { workletNode.disconnect(); workletNode = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }

  if (cancelPendingStart && ws && !liveSessionEstablished && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) {
    plannedReconnect = false;
    ws.close(1000, 'cancel-pending-start');
  }

  if (!preserveStatus) {
    setStatus('Микрофон на паузе. Нажмите 🎙️ чтобы говорить.', '');
  }
}

function endSession() {
  sessionEndedIntentionally = true;
  clearTimeout(reconnectTimer);
  plannedReconnect = false;
  controlledReconnectState = null;
  sessionConnectionModeOverride = null;
  pendingModeFallback = null;
  pendingModeFallbackMessage = '';
  modeFallbackUsed = false;
  liveSessionEstablished = false;
  pendingRecordingStart = false;
  activeConnectionMode = liveSettings.live_connection_mode || 'standard';
  resumptionToken = '';
  sessionStorage.removeItem('liveResumptionToken');
  reconnectAttempt = 0;
  
  if (recording) stopRecording();
  if (ws) { ws.close(); ws = null; }
  
  flushPlayback();
  setStatus('Сессия завершена');
  endBtn.disabled = true;
  haptic?.notificationOccurred('success');
}

/* ── Utility ────────────────────────────────────────────────────────── */
function arrayBufferToBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = '';
  for (let i = 0; i < bytes.byteLength; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return btoa(binary);
}

/* ── Event Listeners ────────────────────────────────────────────────── */
micBtn.addEventListener('click', () => {
  if (!recording && !pendingRecordingStart) {
    startRecording();
  } else {
    stopRecording();
  }
});

endBtn.addEventListener('click', endSession);
settingsBtn.addEventListener('click', openLiveSettingsSheet);
sheetOverlay.addEventListener('click', closeLiveSettingsSheet);
liveSettingsCancelBtn.addEventListener('click', closeLiveSettingsSheet);
liveSettingsSaveBtn.addEventListener('click', saveLiveSettings);
liveConnectionModesEl.addEventListener('click', (event) => {
  const button = event.target.closest('[data-live-connection-mode]');
  if (!button) return;
  draftLiveSettings.live_connection_mode = button.dataset.liveConnectionMode;
  renderLiveSettingOptions();
});
liveVoiceOptionsEl.addEventListener('click', (event) => {
  const button = event.target.closest('[data-live-voice]');
  if (!button) return;
  draftLiveSettings.live_voice_name = button.dataset.liveVoice;
  renderLiveSettingOptions();
});
liveThinkingOptionsEl.addEventListener('click', (event) => {
  const button = event.target.closest('[data-live-thinking]');
  if (!button) return;
  draftLiveSettings.live_thinking_level = button.dataset.liveThinking;
  renderLiveSettingOptions();
});

loadLiveSettings().catch(() => {
  renderSettingsSummary();
  showError('Не удалось загрузить live-настройки');
});
</script>
