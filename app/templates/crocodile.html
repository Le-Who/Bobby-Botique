<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>🐊 Крокодил</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* ── Midnight Glass Design System ───────────────────────────────────── */
    :root {
      --bg:           #0a0d14;
      --surface:      rgba(255,255,255,0.06);
      --surface-alt:  rgba(255,255,255,0.10);
      --border:       rgba(255,255,255,0.10);
      --accent:       #00e0ff;
      --accent-warm:  #ff6b6b;
      --accent-ok:    #00e096;
      --accent-mid:   #ffbd59;
      --text:         #e8eaf0;
      --text-dim:     rgba(232,234,240,0.55);
      --shadow:       0 8px 32px rgba(0,0,0,0.45);
      --radius:       16px;
      --radius-sm:    10px;
      --blur:         blur(20px);
      --font:         'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ── Layout ─────────────────────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px 10px;
      background: rgba(10,13,20,0.92);
      backdrop-filter: var(--blur);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.3px;
    }

    #attempts-badge {
      font-size: 13px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      color: var(--text-dim);
      transition: color .3s, background .3s;
    }

    #attempts-badge.danger {
      color: var(--accent-warm);
      background: rgba(255,107,107,0.15);
      border-color: rgba(255,107,107,0.3);
    }

    /* ── Category pill ───────────────────────────────────────────────────── */
    #category-pill {
      text-align: center;
      padding: 8px 20px 0;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    /* ── Hint area ───────────────────────────────────────────────────────── */
    #hint-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      gap: 16px;
      overflow-y: auto;
    }

    /* Crocodile icon area */
    .croc-icon {
      font-size: 64px;
      line-height: 1;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 4px 12px rgba(0,224,255,0.25));
      transition: transform .3s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    /* State screen */
    #state-label {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.3px;
    }

    /* Semantic feedback card */
    #feedback-card {
      width: 100%;
      max-width: 340px;
      padding: 16px 20px;
      border-radius: var(--radius);
      background: var(--surface);
      backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      text-align: center;
      transition: all .4s cubic-bezier(.16,1,.3,1);
      transform: translateY(12px);
      opacity: 0;
    }

    #feedback-card.visible {
      transform: translateY(0);
      opacity: 1;
    }

    #feedback-card.cold {
      border-color: rgba(100,149,237,0.35);
      background: rgba(100,149,237,0.08);
    }
    #feedback-card.warm {
      border-color: rgba(255,189,89,0.35);
      background: rgba(255,189,89,0.08);
    }
    #feedback-card.hot {
      border-color: rgba(0,224,150,0.35);
      background: rgba(0,224,150,0.08);
    }
    #feedback-card.exact {
      border-color: rgba(0,224,150,0.6);
      background: rgba(0,224,150,0.15);
    }

    #feedback-status {
      font-size: 22px;
      margin-bottom: 6px;
    }

    #feedback-hint {
      font-size: 14px;
      color: var(--text);
      line-height: 1.5;
    }

    #feedback-score {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
    }

    /* Score bar */
    #score-bar-wrap {
      width: 100%;
      max-width: 340px;
      height: 4px;
      background: var(--surface-alt);
      border-radius: 4px;
      overflow: hidden;
      display: none;
    }
    #score-bar-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #6495ed, #00e096);
      transition: width .4s cubic-bezier(.16,1,.3,1);
      width: 0%;
    }

    /* ── Input zone ──────────────────────────────────────────────────────── */
    #input-zone {
      padding: 12px 20px;
      padding-bottom: max(16px, env(safe-area-inset-bottom, 16px));
      background: rgba(10,13,20,0.92);
      backdrop-filter: var(--blur);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    #guess-input {
      flex: 1;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 16px;
      font-family: var(--font);
      color: var(--text);
      outline: none;
      transition: border-color .2s, background .2s;
      -webkit-appearance: none;
    }
    #guess-input::placeholder { color: var(--text-dim); }
    #guess-input:focus {
      border-color: rgba(0,224,255,0.4);
      background: rgba(255,255,255,0.12);
    }
    #guess-input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #send-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent), #6d72ff);
      color: #000;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .15s, opacity .15s, box-shadow .15s;
      box-shadow: 0 4px 14px rgba(0,224,255,0.3);
      flex-shrink: 0;
    }
    #send-btn:hover   { transform: scale(1.08); }
    #send-btn:active  { transform: scale(.94); box-shadow: none; }
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    /* ── Overlay screens ─────────────────────────────────────────────────── */
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: rgba(10,13,20,0.95);
      backdrop-filter: var(--blur);
      padding: 40px 32px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s;
      z-index: 10;
    }
    #overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    #overlay-icon   { font-size: 72px; line-height: 1; }
    #overlay-title  {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.2;
      background: linear-gradient(90deg, #00e096, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #overlay-title.loss {
      background: linear-gradient(90deg, var(--accent-warm), #ff9f43);
    }
    #overlay-word {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--text);
    }
    #overlay-sub { font-size: 14px; color: var(--text-dim); line-height: 1.6; }

    /* ── Connecting state ────────────────────────────────────────────────── */
    #connecting {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      background: var(--bg);
      z-index: 20;
      transition: opacity .35s;
    }
    #connecting.hidden { opacity: 0; pointer-events: none; }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .conn-label { font-size: 14px; color: var(--text-dim); }

    /* ── Error modal ─────────────────────────────────────────────────────── */
    #error-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 12px 20px;
      padding-bottom: max(12px, env(safe-area-inset-bottom, 12px));
      background: rgba(255,107,107,0.15);
      border-top: 1px solid rgba(255,107,107,0.3);
      color: var(--accent-warm);
      font-size: 13px;
      text-align: center;
      transform: translateY(100%);
      transition: transform .3s;
      z-index: 30;
    }
    #error-bar.show { transform: translateY(0); }
  </style>
</head>
<body>
<div id="connecting">
  <div class="spinner"></div>
  <span class="conn-label">Подключение к игре…</span>
</div>

<div id="app">
  <header>
    <h1>🐊 Крокодил</h1>
    <span id="attempts-badge">0 / 10</span>
  </header>
  <div id="category-pill"></div>

  <div id="hint-area">
    <div class="croc-icon">🐊</div>
    <div id="state-label">Угадай слово!</div>
    <div id="feedback-card">
      <div id="feedback-status"></div>
      <div id="feedback-hint"></div>
      <div id="feedback-score"></div>
    </div>
    <div id="score-bar-wrap">
      <div id="score-bar-fill"></div>
    </div>
  </div>

  <div id="input-zone">
    <input
      id="guess-input"
      type="text"
      placeholder="Твоя догадка…"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="none"
      spellcheck="false"
      maxlength="80"
    />
    <button id="send-btn" aria-label="Отправить">➤</button>
  </div>
</div>

<!-- Win / Loss overlay -->
<div id="overlay">
  <div id="overlay-icon">🎉</div>
  <div id="overlay-title">Угадано!</div>
  <div id="overlay-word"></div>
  <div id="overlay-sub"></div>
</div>

<div id="error-bar"></div>

<script>
/* ── Telegram WebApp init ───────────────────────────────────────────── */
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor?.('#0a0d14');
  tg.setBackgroundColor?.('#0a0d14');
}

/* ── Config from URL params ─────────────────────────────────────────── */
const params     = new URLSearchParams(location.search);
const GAME_ID    = params.get('game_id') || '{{ game_id }}';
const INIT_DATA  = tg?.initData || '';

if (!GAME_ID) {
  document.getElementById('connecting').querySelector('.conn-label').textContent =
    '❌ game_id не указан';
}

/* ── Helpers ────────────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);

function setAttempts(used, max) {
  const badge = $('attempts-badge');
  badge.textContent = `${used} / ${max}`;
  badge.classList.toggle('danger', used >= max - 2);
}

const STATUS_ICON = { cold: '❄️', warm: '🌡️', hot: '🔥', exact_match: '✅' };

function showFeedback({ status, hint, score, cached }) {
  const card = $('feedback-card');
  card.className = 'visible ' + (status === 'exact_match' ? 'exact' : (status || ''));
  $('feedback-status').textContent = STATUS_ICON[status] || '❓';
  $('feedback-hint').textContent   = hint || '';
  $('feedback-score').textContent  =
    typeof score === 'number' ? `${(score * 100).toFixed(0)}% схожесть${cached ? ' · кэш ⚡' : ''}` : '';

  const bar  = $('score-bar-wrap');
  const fill = $('score-bar-fill');
  bar.style.display = 'block';
  fill.style.width  = `${((score || 0) * 100).toFixed(1)}%`;
}

function showOverlay({ win, word, attempts, maxAttempts, customTitle }) {
  const overlay = $('overlay');
  $('overlay-icon').textContent  = win ? '🎉' : '😔';
  const title = $('overlay-title');
  title.textContent = customTitle || (win ? 'Угадано!' : 'Не угадали.');
  title.className   = win ? '' : 'loss';
  $('overlay-word').textContent  = (word || '').toUpperCase();
  if (customTitle) {
      $('overlay-sub').textContent = 'Помогай в чате и наблюдай за догадками!';
  } else {
      $('overlay-sub').textContent   = win
        ? `За ${attempts} из ${maxAttempts} попыток`
        : `Исчерпаны все ${maxAttempts} попытки`;
  }
  overlay.classList.add('visible');
}

function showError(msg, autoDismiss = true) {
  const bar = $('error-bar');
  bar.textContent = msg;
  bar.classList.add('show');
  if (autoDismiss) setTimeout(() => bar.classList.remove('show'), 3500);
}

/* ── WebSocket ──────────────────────────────────────────────────────── */
let ws = null;
let reconnectAttempts = 0;
let gameOver = false;
let maxAttempts = 10;
let attemptsUsed = 0;

function wsUrl() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const base  = `${proto}://${location.host}`;
  const enc   = encodeURIComponent(INIT_DATA);
  return `${base}/webapp/game/ws?game_id=${GAME_ID}&initData=${enc}`;
}

function connect() {
  if (gameOver) return;
  ws = new WebSocket(wsUrl());

  ws.onopen = () => {
    reconnectAttempts = 0;
    const conn = $('connecting');
    conn.classList.add('hidden');
    setTimeout(() => conn.remove?.(), 400);
    setInputEnabled(true);
  };

  ws.onmessage = ev => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }

    switch (msg.event) {
      case 'game_state':
        maxAttempts  = msg.max_attempts || 10;
        attemptsUsed = msg.attempts || 0;
        setAttempts(attemptsUsed, maxAttempts);
        if (msg.category) {
          $('category-pill').textContent = `📂 ${msg.category}`;
        }
        if (msg.is_creator) {
          gameOver = true;
          setInputEnabled(false);
          $('state-label').textContent = 'Ты ведущий!';
          showFeedback({ status: 'warm', hint: 'Жди, пока твой друг отгадает слово.', score: null });
          setTimeout(() => showOverlay({
            win: true, word: msg.target_word, attempts: 0, maxAttempts, customTitle: 'Твое слово:'
          }), 600);
        }
        break;

      case 'result':
        attemptsUsed = msg.attempts;
        maxAttempts  = msg.max_attempts;
        setAttempts(attemptsUsed, maxAttempts);
        showFeedback(msg);
        if (msg.status === 'exact_match') {
          gameOver = true;
          setInputEnabled(false);
          setTimeout(() => showOverlay({
            win: true, word: msg.word, attempts: attemptsUsed, maxAttempts,
          }), 600);
        }
        break;

      case 'game_over':
        gameOver = true;
        attemptsUsed = msg.attempts;
        maxAttempts  = msg.max_attempts;
        setAttempts(attemptsUsed, maxAttempts);
        setInputEnabled(false);
        setTimeout(() => showOverlay({
          win: false, word: msg.word, attempts: attemptsUsed, maxAttempts,
        }), 200);
        break;

      case 'error':
        showError(msg.message || 'Произошла ошибка');
        break;
    }
  };

  ws.onclose = ev => {
    if (gameOver) return;
    setInputEnabled(false);
    if (ev.code === 4003) { showError('❌ Ошибка авторизации', false); return; }
    if (ev.code === 4008) { showError('⌛ Игра истекла', false); return; }
    if (ev.code === 4009) { showOverlay({ win: false, word: '', attempts: maxAttempts, maxAttempts }); return; }
    // Exponential backoff reconnect
    const delay = Math.min(500 * Math.pow(1.8, reconnectAttempts++), 12000);
    setTimeout(connect, delay);
    showError(`Переподключение через ${(delay / 1000).toFixed(0)}s…`);
  };

  ws.onerror = () => {}; // onclose handles retry
}

/* ── Input handling ─────────────────────────────────────────────────── */
function setInputEnabled(on) {
  $('guess-input').disabled = !on;
  $('send-btn').disabled    = !on;
}

function sendGuess() {
  const input = $('guess-input');
  const word  = input.value.trim();
  if (!word || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: 'guess', word }));
  input.value = '';
  input.focus();
}

$('send-btn').addEventListener('click', sendGuess);
$('guess-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); sendGuess(); }
});

/* ── Boot ───────────────────────────────────────────────────────────── */
setInputEnabled(false);
if (GAME_ID) connect();
else showError('❌ Игра не найдена', false);
</script>
</body>
</html>
