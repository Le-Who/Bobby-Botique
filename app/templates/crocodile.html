<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>🐊 Крокодил</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    /* ── Design tokens ───────────────────────────────────────────────────── */
    :root {
      --bg:           #0a0d14;
      --surface:      rgba(255,255,255,0.06);
      --surface-alt:  rgba(255,255,255,0.10);
      --border:       rgba(255,255,255,0.10);
      --accent:       #00e0ff;
      --accent-warm:  #ff6b6b;
      --accent-ok:    #00e096;
      --accent-mid:   #ffbd59;
      --text:         #e8eaf0;
      --text-dim:     rgba(232,234,240,0.55);
      --blur:         blur(20px);
      --radius:       16px;
      --radius-sm:    10px;
      --font:         'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

      /* Bubble palette */
      --b-user:       rgba(0,224,255,0.13);
      --b-user-bdr:   rgba(0,224,255,0.28);
      --b-cold:       rgba(100,149,237,0.12);
      --b-cold-bdr:   rgba(100,149,237,0.32);
      --b-warm:       rgba(255,189,89,0.12);
      --b-warm-bdr:   rgba(255,189,89,0.35);
      --b-hot:        rgba(0,224,150,0.14);
      --b-hot-bdr:    rgba(0,224,150,0.35);
      --b-exact:      rgba(0,224,150,0.24);
      --b-exact-bdr:  rgba(0,224,150,0.65);
      --b-judge:      rgba(255,255,255,0.06);
      --b-judge-bdr:  rgba(255,255,255,0.10);
      --b-sys:        rgba(255,189,89,0.07);
      --b-sys-bdr:    rgba(255,189,89,0.20);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* ── App shell ───────────────────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 13px 16px 9px;
      background: rgba(10,13,20,0.92);
      backdrop-filter: var(--blur);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 17px;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      flex: 1;
    }

    #hint-btn {
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      white-space: nowrap;
      transition: all .2s;
    }
    #hint-btn.ready {
      color: var(--accent-mid);
      border-color: rgba(255,189,89,0.35);
      background: rgba(255,189,89,0.08);
    }
    #hint-btn:not(:disabled):active { transform: scale(.93); }
    #hint-btn:disabled { opacity: .35; cursor: not-allowed; }

    #attempts-badge {
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      white-space: nowrap;
      transition: color .3s, background .3s;
    }
    #attempts-badge.danger {
      color: var(--accent-warm);
      background: rgba(255,107,107,0.15);
      border-color: rgba(255,107,107,0.3);
    }

    /* ── Category pill ───────────────────────────────────────────────────── */
    #category-pill {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-dim);
      letter-spacing: .5px;
      text-transform: uppercase;
      text-align: center;
      padding: 5px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      flex-shrink: 0;
      min-height: 26px;
    }

    /* ── Chat area ───────────────────────────────────────────────────────── */
    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      -webkit-overflow-scrolling: touch;
    }

    /* ── Bubble rows ─────────────────────────────────────────────────────── */
    .bubble-row {
      display: flex;
      animation: b-in .22s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes b-in {
      from { opacity:0; transform:scale(.82) translateY(6px); }
      to   { opacity:1; transform:scale(1)   translateY(0); }
    }
    .bubble-row.user   { justify-content: flex-end; }
    .bubble-row.judge  { justify-content: flex-start; }
    .bubble-row.system { justify-content: center; }

    /* ── Bubbles ─────────────────────────────────────────────────────────── */
    .bubble {
      max-width: 80%;
      padding: 8px 13px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      word-break: break-word;
      line-height: 1.35;
    }

    /* User bubbles by state */
    .bubble.user            { background:var(--b-user);  border-color:var(--b-user-bdr);  border-bottom-right-radius:4px; }
    .bubble.user.cold       { background:var(--b-cold);  border-color:var(--b-cold-bdr);  }
    .bubble.user.warm       { background:var(--b-warm);  border-color:var(--b-warm-bdr);  }
    .bubble.user.hot        { background:var(--b-hot);   border-color:var(--b-hot-bdr);   }
    .bubble.user.exact_match{ background:var(--b-exact); border-color:var(--b-exact-bdr); box-shadow:0 0 18px rgba(0,224,150,.18); }

    /* Pending animation */
    .bubble.pending { animation: b-in .22s cubic-bezier(.34,1.56,.64,1) both, pulse 1.3s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:.9} }

    /* Judge / system bubbles */
    .bubble.judge  { background:var(--b-judge); border-color:var(--b-judge-bdr); border-bottom-left-radius:4px; color:var(--text-dim); font-size:13px; }
    .bubble.system { background:var(--b-sys);   border-color:var(--b-sys-bdr);   font-size:12px; color:var(--accent-mid); text-align:center; padding:5px 12px; border-radius:12px; }

    /* Bubble internals */
    .b-word  { display:block; font-size:15px; font-weight:600; color:var(--text); }
    .b-meta  { display:flex; align-items:center; gap:5px; margin-top:3px; flex-wrap:wrap; }
    .b-icon  { font-size:13px; line-height:1; }
    .b-score { font-size:11px; color:var(--text-dim); font-variant-numeric:tabular-nums; }
    .b-hint  { display:block; font-size:12px; color:var(--text-dim); margin-top:3px; font-style:italic; }

    /* ── Typing indicator ────────────────────────────────────────────────── */
    #typing-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 3px 13px 5px;
      font-size: 12px;
      color: var(--text-dim);
      flex-shrink: 0;
      height: 26px;
      opacity: 1;
      transition: opacity .2s;
    }
    #typing-row.hidden { opacity: 0; pointer-events: none; }
    .typing-dots { display:flex; gap:3px; }
    .typing-dots span {
      width: 5px; height: 5px;
      background: var(--accent);
      border-radius: 50%;
      animation: dot 1.2s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .15s; }
    .typing-dots span:nth-child(3) { animation-delay: .30s; }
    @keyframes dot { 0%,80%,100%{transform:scale(.55);opacity:.35} 40%{transform:scale(1);opacity:1} }

    /* ── Input zone ──────────────────────────────────────────────────────── */
    #input-zone {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      padding-bottom: max(14px, env(safe-area-inset-bottom, 14px));
      background: rgba(10,13,20,0.92);
      backdrop-filter: var(--blur);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    #guess-input {
      flex: 1;
      background: var(--surface-alt);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 15px;
      font-size: 16px;
      font-family: var(--font);
      color: var(--text);
      outline: none;
      transition: border-color .2s, background .2s;
      -webkit-appearance: none;
    }
    #guess-input::placeholder { color: var(--text-dim); }
    #guess-input:focus { border-color: rgba(0,224,255,.5); background: rgba(255,255,255,.12); }
    #guess-input:disabled { opacity: .35; cursor: not-allowed; }

    #send-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent), #6d72ff);
      color: #000;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform .15s, opacity .15s;
      box-shadow: 0 4px 14px rgba(0,224,255,.28);
      flex-shrink: 0;
    }
    #send-btn:hover   { transform: scale(1.08); }
    #send-btn:active  { transform: scale(.92); }
    #send-btn:disabled { opacity: .3; cursor: not-allowed; transform: none; }

    /* ── Win / Loss overlay ──────────────────────────────────────────────── */
    #overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px;
      background: rgba(10,13,20,.96);
      backdrop-filter: var(--blur);
      padding: 40px 32px; text-align: center;
      opacity: 0; pointer-events: none;
      transition: opacity .35s;
      z-index: 10;
    }
    #overlay.visible { opacity: 1; pointer-events: all; }
    #overlay-icon  { font-size: 72px; line-height: 1; }
    #overlay-title {
      font-size: 26px; font-weight: 700;
      background: linear-gradient(90deg, #00e096, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #overlay-title.loss { background: linear-gradient(90deg, var(--accent-warm), #ff9f43); }
    #overlay-word { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
    #overlay-sub  { font-size: 14px; color: var(--text-dim); line-height: 1.6; }

    /* ── Connecting splash ───────────────────────────────────────────────── */
    #connecting {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
      background: var(--bg); z-index: 20;
      transition: opacity .35s;
    }
    #connecting.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 38px; height: 38px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .conn-label { font-size: 14px; color: var(--text-dim); }

    /* ── Error bar ───────────────────────────────────────────────────────── */
    #error-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 12px 20px;
      padding-bottom: max(12px, env(safe-area-inset-bottom, 12px));
      background: rgba(255,107,107,.14);
      border-top: 1px solid rgba(255,107,107,.3);
      color: var(--accent-warm);
      font-size: 13px; text-align: center;
      transform: translateY(100%);
      transition: transform .3s;
      z-index: 30;
    }
    #error-bar.show { transform: translateY(0); }
  </style>
</head>
<body>

<div id="connecting">
  <div class="spinner"></div>
  <span class="conn-label">Подключение к игре…</span>
</div>

<div id="app">
  <header>
    <h1>🐊 Крокодил</h1>
    <button id="hint-btn" disabled title="Подсказка">💡</button>
    <span id="attempts-badge">0 / 10</span>
  </header>
  <div id="category-pill"></div>

  <div id="chat-area"></div>

  <div id="typing-row" class="hidden">
    <div class="typing-dots"><span></span><span></span><span></span></div>
    <span>Крокодил оценивает…</span>
  </div>

  <div id="input-zone">
    <input
      id="guess-input"
      type="text"
      placeholder="Твоя догадка…"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="none"
      spellcheck="false"
      maxlength="80"
    />
    <button id="send-btn" aria-label="Отправить">➤</button>
  </div>
</div>

<div id="overlay">
  <div id="overlay-icon">🎉</div>
  <div id="overlay-title">Угадано!</div>
  <div id="overlay-word"></div>
  <div id="overlay-sub"></div>
</div>

<div id="error-bar"></div>

<script>
/* ── Telegram WebApp ────────────────────────────────────────────────────── */
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor?.('#0a0d14');
  tg.setBackgroundColor?.('#0a0d14');
}
const haptic = tg?.HapticFeedback;

/* ── Config ─────────────────────────────────────────────────────────────── */
const params    = new URLSearchParams(location.search);
const GAME_ID   = params.get('game_id')
               || (tg?.initDataUnsafe?.start_param)
               || params.get('tgWebAppStartParam')
               || '{{ game_id }}';
const INIT_DATA = tg?.initData || '';

const STATUS_ICON  = { cold:'❄️', warm:'🌡️', hot:'🔥', exact_match:'✅' };
const HINTS_TOTAL  = 3;

/* ── DOM helpers ────────────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function uid() {
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}

/* ── Attempts badge ─────────────────────────────────────────────────────── */
function setAttempts(used, max) {
  const b = $('attempts-badge');
  b.textContent = `${used} / ${max}`;
  b.classList.toggle('danger', used >= max - 2);
}

/* ── Error bar ──────────────────────────────────────────────────────────── */
function showError(msg, autoDismiss = true) {
  const bar = $('error-bar');
  bar.textContent = msg;
  bar.classList.add('show');
  if (autoDismiss) setTimeout(() => bar.classList.remove('show'), 3500);
}

/* ── Win/Loss overlay ───────────────────────────────────────────────────── */
function showOverlay({ win, word, attempts, maxAttempts, customTitle }) {
  $('overlay-icon').textContent = win ? '🎉' : '😔';
  const title = $('overlay-title');
  title.textContent = customTitle || (win ? 'Угадано!' : 'Не угадали.');
  title.className   = win ? '' : 'loss';
  $('overlay-word').textContent = (word || '').toUpperCase();
  $('overlay-sub').textContent  = customTitle
    ? 'Наблюдай за догадками!'
    : win
      ? `За ${attempts} из ${maxAttempts} попыток`
      : `Исчерпано ${maxAttempts} попыток`;
  $('overlay').classList.add('visible');
}

/* ── Typing indicator ───────────────────────────────────────────────────── */
const chatArea = $('chat-area');

function updateTyping() {
  $('typing-row').classList.toggle('hidden', !chatArea.querySelector('.bubble.pending'));
}

/* ── Chat bubble helpers ────────────────────────────────────────────────── */
function scrollBottom() {
  chatArea.scrollTop = chatArea.scrollHeight;
}

function appendPendingBubble(word, pendingId) {
  const row = document.createElement('div');
  row.className = 'bubble-row user';
  row.id = `bubble-${pendingId}`;
  row.innerHTML =
    `<div class="bubble user pending">` +
    `<span class="b-word">${escHtml(word)}</span>` +
    `<div class="b-meta"><span class="b-icon">⏳</span></div>` +
    `</div>`;
  chatArea.appendChild(row);
  scrollBottom();
  updateTyping();
}

function resolvePendingBubble(pendingId, { status, hint, score, cached }) {
  const row = document.getElementById(`bubble-${pendingId}`);
  if (!row) return;
  const word     = row.querySelector('.b-word')?.textContent || '';
  const icon     = STATUS_ICON[status] || '❓';
  const cls      = status === 'exact_match' ? 'exact_match' : (status || '');
  const scoreStr = typeof score === 'number'
    ? `${(score * 100).toFixed(0)}%${cached ? ' ⚡' : ''}`
    : '';
  const hintHtml = hint ? `<span class="b-hint">${escHtml(hint)}</span>` : '';
  const bubble = row.querySelector('.bubble');
  bubble.className = `bubble user ${cls}`;
  bubble.innerHTML =
    `<span class="b-word">${escHtml(word)}</span>` +
    `<div class="b-meta">` +
    `<span class="b-icon">${icon}</span>` +
    (scoreStr ? `<span class="b-score">${escHtml(scoreStr)}</span>` : '') +
    `</div>` +
    hintHtml;
  updateTyping();
}

function removePendingBubble(pendingId) {
  const row = document.getElementById(`bubble-${pendingId}`);
  if (row) row.remove();
  updateTyping();
}

function appendCompletedBubble(word, { status, hint, score, cached = false }) {
  const pid = uid();
  appendPendingBubble(word, pid);
  resolvePendingBubble(pid, { status, hint, score, cached });
}

function appendHintBubble(text) {
  const row = document.createElement('div');
  row.className = 'bubble-row system';
  row.innerHTML = `<div class="bubble system">💡 ${escHtml(text)}</div>`;
  chatArea.appendChild(row);
  scrollBottom();
}

/* ── Hint button ────────────────────────────────────────────────────────── */
let hintIndex          = 0;
let hintCooldownActive = true;
let gameOver           = false;

function updateHintBtn() {
  const btn       = $('hint-btn');
  const remaining = HINTS_TOTAL - hintIndex;
  if (gameOver || remaining <= 0) {
    btn.disabled = true;
    btn.classList.remove('ready');
    btn.textContent = '💡';
    return;
  }
  if (hintCooldownActive) {
    btn.disabled = true;
    btn.classList.remove('ready');
    btn.textContent = `⏳`;
    return;
  }
  btn.disabled = false;
  btn.classList.add('ready');
  btn.textContent = `💡 ${remaining}`;
}

function startHintCooldown(ms) {
  hintCooldownActive = true;
  updateHintBtn();
  setTimeout(() => { hintCooldownActive = false; updateHintBtn(); }, ms);
}

$('hint-btn').addEventListener('click', () => {
  if (!ws || ws.readyState !== WebSocket.OPEN || hintCooldownActive || gameOver) return;
  haptic?.impactOccurred('soft');
  ws.send(JSON.stringify({ type: 'hint', hint_index: hintIndex }));
  hintIndex++;
  startHintCooldown(9000); // per-hint cooldown between requests
});

/* ── WebSocket ──────────────────────────────────────────────────────────── */
let ws               = null;
let reconnectAttempts= 0;
let maxAttempts      = 10;
let attemptsUsed     = 0;

function wsUrl() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const enc   = encodeURIComponent(INIT_DATA);
  return `${proto}://${location.host}/webapp/game/ws?game_id=${GAME_ID}&initData=${enc}`;
}

function connect() {
  if (gameOver) return;
  ws = new WebSocket(wsUrl());

  ws.onopen = () => {
    reconnectAttempts = 0;
    $('connecting').classList.add('hidden');
    setInputEnabled(true);
    startHintCooldown(12000); // 12s before first hint available
  };

  ws.onmessage = ev => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    handleMessage(msg);
  };

  ws.onclose = ev => {
    if (gameOver) return;
    setInputEnabled(false);
    if (ev.code === 4003) { showError('❌ Ошибка авторизации', false); return; }
    if (ev.code === 4008) { showError('⌛ Игра истекла', false); return; }
    if (ev.code === 4009) { showOverlay({ win:false, word:'', attempts:maxAttempts, maxAttempts }); return; }
    const delay = Math.min(500 * Math.pow(1.8, reconnectAttempts++), 12000);
    setTimeout(connect, delay);
    showError(`Переподключение через ${(delay/1000).toFixed(0)}s…`);
  };

  ws.onerror = () => {};
}

/* ── Server message dispatcher ──────────────────────────────────────────── */
function handleMessage(msg) {
  switch (msg.event) {

    case 'game_state': {
      maxAttempts  = msg.max_attempts || 10;
      attemptsUsed = msg.attempts     || 0;
      setAttempts(attemptsUsed, maxAttempts);
      if (msg.category) $('category-pill').textContent = `📂 ${msg.category}`;
      if (msg.is_creator) {
        gameOver = true;
        setInputEnabled(false);
        updateHintBtn();
        setTimeout(() => showOverlay({
          win: true, word: msg.target_word,
          attempts: 0, maxAttempts,
          customTitle: 'Твоё слово:',
        }), 400);
      }
      break;
    }

    case 'history_sync': {
      (msg.items || []).forEach(item => {
        appendCompletedBubble(item.word, {
          status: item.status,
          hint:   item.hint,
          score:  item.score,
        });
        attemptsUsed++;
      });
      setAttempts(attemptsUsed, maxAttempts);
      break;
    }

    case 'result': {
      const pid = msg.pending_id;
      attemptsUsed = msg.attempts;
      setAttempts(attemptsUsed, maxAttempts);
      if (pid) resolvePendingBubble(pid, {
        status: msg.status, hint: msg.hint,
        score: msg.score, cached: msg.cached,
      });
      // Haptic feedback by temperature
      if (msg.status === 'exact_match') {
        haptic?.notificationOccurred('success');
        gameOver = true;
        setInputEnabled(false);
        updateHintBtn();
        setTimeout(() => showOverlay({
          win: true, word: msg.word, attempts: attemptsUsed, maxAttempts,
        }), 600);
      } else if (msg.status === 'hot') {
        haptic?.notificationOccurred('success');
      } else if (msg.status === 'warm') {
        haptic?.impactOccurred('medium');
      } else {
        haptic?.impactOccurred('light');
      }
      break;
    }

    case 'judge_unavailable': {
      const pid = msg.pending_id;
      if (pid) removePendingBubble(pid);
      haptic?.notificationOccurred('warning');
      showError(msg.message || '🤔 Крокодил задумался. Попытка не засчитана — повтори!');
      break;
    }

    case 'game_over': {
      gameOver = true;
      attemptsUsed = msg.attempts;
      setAttempts(attemptsUsed, maxAttempts);
      setInputEnabled(false);
      updateHintBtn();
      haptic?.notificationOccurred('error');
      setTimeout(() => showOverlay({
        win: false, word: msg.word, attempts: attemptsUsed, maxAttempts,
      }), 200);
      break;
    }

    case 'hint': {
      if (msg.available === false) {
        // Hints not yet ready or exhausted
        showError(msg.text || '⏳ Подсказки ещё готовятся, подожди немного…');
        if (hintIndex > 0) hintIndex--; // rollback so user can retry
      } else {
        haptic?.impactOccurred('soft');
        appendHintBubble(msg.text || '');
      }
      updateHintBtn();
      break;
    }

    case 'error': {
      showError(msg.message || 'Произошла ошибка');
      break;
    }
  }
}

/* ── Input handling ─────────────────────────────────────────────────────── */
function setInputEnabled(on) {
  $('guess-input').disabled = !on;
  $('send-btn').disabled    = !on;
}

function sendGuess() {
  const input = $('guess-input');
  const word  = input.value.trim();
  if (!word || !ws || ws.readyState !== WebSocket.OPEN) return;

  const pid = uid();
  ws.send(JSON.stringify({ type: 'guess', word, pending_id: pid }));
  input.value = '';
  input.focus();
  appendPendingBubble(word, pid);
  haptic?.impactOccurred('medium');
}

$('send-btn').addEventListener('click', sendGuess);
$('guess-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); sendGuess(); }
});

/* ── Boot ───────────────────────────────────────────────────────────────── */
updateHintBtn();
setInputEnabled(false);
if (GAME_ID) connect();
else showError('❌ Игра не найдена', false);
</script>
