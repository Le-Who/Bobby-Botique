services:
  telegram-gemini-bot:
    build: .
    container_name: telegram-gemini-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - "10000:10000"
