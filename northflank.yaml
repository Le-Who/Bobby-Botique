# Northflank.com Configuration
# Миграция с Render.com на Northflank.com

services:
  - name: gemaibotv2
    type: worker
    runtime: docker
    source:
      type: git
      url: https://github.com/Le-Who/gemaibotv2
      branch: main
    build:
      dockerfile: ./Dockerfile
      context: .
    env:
      - name: LOG_JSON
        value: "true"
      - name: REDIS_URL
        secret: true
      - name: ENABLE_PERSISTENT_QUEUE
        value: "true"
      - name: TAVILY_API_KEYS
        secret: true
      - name: TELEGRAM_BOT_TOKEN
        secret: true
      - name: GEMINI_API_KEYS
        secret: true
      - name: DATABASE_URL
        secret: true
      - name: ADMIN_ID
        secret: true
    resources:
      cpu: 0.5
      memory: 512Mi
    scaling:
      min_replicas: 1
      max_replicas: 1
