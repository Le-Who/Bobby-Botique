# Pre-commit hooks — run automatically on `git commit`.
# Install once with:  pre-commit install
# Run manually with:  pre-commit run --all-files
#
# Mirrors the CI lint job (ci.yml) so bugs are caught locally before push.
# F402 (import-shadowed-by-loop-var) is the rule that would have caught the
# t-variable shadowing regression in ai_chat.py (incident 2026-04-05).

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      # Lint: catches F402, B, SIM, etc. — matches pyproject.toml [tool.ruff.lint]
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Format: enforces consistent style
      - id: ruff-format
