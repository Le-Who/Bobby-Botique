
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: documentation-encoding
        name: Documentation UTF-8 integrity
        entry: python scripts/check_encoding.py
        language: python
        files: '(?i)\.md$'
