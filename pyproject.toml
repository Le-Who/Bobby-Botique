[project]
name = "gemaibotv2"
version = "0.0.0"
description = "Telegram AI bot application"
requires-python = ">=3.14,<3.15"
dependencies = [
    "python-telegram-bot[job-queue]>=20.7,<23.0",
    "google-genai>=2.25.0,<3.0.0",
    "httpx>=0.25.0,<1.0.0",
    "asyncpg>=0.28.0,<1.0.0",
    "redis>=4.5.0,<9.0.0",
    "quart==0.23.1",
    "hypercorn>=0.14.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "tzdata>=2024.1",
    "psutil>=5.9.0,<8.0.0",
    "cachetools>=5.3.0,<8.0.0",
    "cryptography>=50.0.0,<51.0.0",
    "pypdf>=6.21.4,<7.0.0",
    "python-docx>=0.8.11,<2.0.0",
    "pillow>=13.0.0,<14.0.0",
    "structlog>=26.1.0,<27.0.0",
    "uvloop>=0.19.0,<1.0.0; sys_platform != 'win32'",
    "orjson>=3.10.0,<4.0.0",
    "ephem>=4.1.0,<5.0.0",
    "geonamescache>=3.0.1,<4.0.0",
    "openai==3.42.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0,<10.0.0",
    "pytest-asyncio>=0.21.0,<2.0.0",
    "pytest-cov>=4.0.0,<8.0.0",
    "pytest-timeout>=2.0.0,<3.0.0",
    "pytest-xdist>=3.0.0,<4.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "mypy>=1.0.0,<3.0.0",
    "packaging>=24.0.0,<27.0.0",
    "pip-audit==2.10.1",
    "ruff==0.17.2",
    "pre-commit>=3.0.0,<5.0.0",
]

[tool.uv]
constraint-dependencies = ["pyasn1>=0.6.5"]
package = false
required-version = "==0.13.5"

[tool.dependency-frontier]
python-version = "3.14"
production-platform = "x86_64-manylinux_2_28"
resolution-platforms = ["x86_64-manylinux_2_28", "x86_64-pc-windows-msvc"]
cooldown-days = 7
allowed-source-builds = []
license-denylist = []

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["revisions"]

[tool.ruff.per-file-target-version]
"ops/redis/*.py" = "py312"

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "F",
    "B",
    "I",
    "UP",
    "SIM",
    "E",
    "C4",
    "PIE",
    "T20",
    "RUF006",
    "RUF059",
]

ignore = [
    "F401",
    "E501",
    "E402",
    "SIM105",
    "SIM115",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "RUF", "SIM", "E741", "T20"]
"app/handlers/messages.py" = ["F823"]
"app/config.py" = ["T201"]
"test_*.py" = ["T201", "E402"]
"scripts/**" = ["T201"]
"artifacts/perf/**" = ["T201", "I001", "F841", "F821", "F541"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.14"
explicit_package_bases = true
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
warn_unreachable = true
show_error_codes = true
disallow_untyped_defs = false
disable_error_code = ["no-any-return", "import-untyped"]

[[tool.mypy.overrides]]
module = [
    "app.handlers.*",
]
disable_error_code = ["union-attr", "has-type", "index", "arg-type"]

