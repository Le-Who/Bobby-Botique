[project]
name = "gemaibotv2"
version = "0.0.0"
description = "Telegram AI bot application"
requires-python = ">=3.14,<3.15"
dependencies = [
    "python-telegram-bot[job-queue]>=20.7,<23.0",
    "google-genai>=0.3.0,<2.0.0",
    "httpx>=0.25.0,<1.0.0",
    "asyncpg>=0.28.0,<1.0.0",
    "redis>=4.5.0,<8.0.0",
    "Quart==0.22.0",
    "hypercorn>=0.14.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "tzdata>=2024.1",
    "psutil>=5.9.0,<8.0.0",
    "cachetools>=5.3.0,<8.0.0",
    "cryptography>=50.0.0,<51.0.0",
    "pypdf>=5.0.0,<7.0.0",
    "python-docx>=0.8.11,<2.0.0",
    "Pillow>=9.5.0,<13.0.0",
    "tavily-python>=0.3.0,<1.0.0",
    "rich>=13.0.0,<15.0.0",
    "structlog>=24.1.0,<25.0.0",
    "uvloop>=0.19.0,<1.0.0; sys_platform != 'win32'",
    "orjson>=3.10.0,<4.0.0",
    "msgspec>=0.18.0,<1.0.0",
    "ephem>=4.1.0,<5.0.0",
    "geonamescache>=3.0.1,<4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0,<10.0.0",
    "pytest-asyncio>=0.21.0,<2.0.0",
    "pytest-cov>=4.0.0,<7.0.0",
    "pytest-timeout>=2.0.0,<3.0.0",
    "pytest-xdist>=3.0.0,<4.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "mypy>=1.0.0,<2.0.0",
    "packaging>=24.0.0,<27.0.0",
    "pip-audit==2.10.1",
    "ruff==0.15.2",
    "pre-commit>=3.0.0,<5.0.0",
]

[tool.uv]
package = false
required-version = "==0.12.6"

[tool.dependency-frontier]
python-version = "3.14"
production-platform = "x86_64-manylinux_2_28"
resolution-platforms = ["x86_64-manylinux_2_28", "x86_64-pc-windows-msvc"]
cooldown-days = 7
allowed-source-builds = []
license-denylist = []

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "F",      # Pyflakes (unused imports, undefined names, etc.)
    "B",      # flake8-bugbear (common Python bugs)
    "I",      # isort (import ordering)
    "UP",     # pyupgrade (Python 3.11+ syntax modernization)
    "SIM",    # flake8-simplify (simplifiable code)
    "E",      # pycodestyle (style errors)
    "C4",     # flake8-comprehensions (unnecessary list/dict/set comprehensions)
    "PIE",    # flake8-pie (misc. antipatterns)
    "T20",    # flake8-print (stray print() calls)
    "RUF006", # asyncio dangling tasks
    "RUF059", # unused unpacked variables
]

ignore = [
    "F401",   # Handled by noqa comments on intentional re-exports
    "E501",   # Line length — enforced by formatter, not linter (line-length=120)
    "E402",   # Module-level imports not at top — guarded/conditional imports are intentional
    "SIM105", # contextlib.suppress — try/except pass is clearer in this codebase
    "SIM115", # open-file-with-context-handler — not applicable to all use cases
]

[tool.ruff.lint.per-file-ignores]
# Test files may use broad exceptions, assert, short var names, etc.
"tests/**" = ["B", "RUF", "SIM", "E741", "T20"]
# _cleanup_task is a module-level var; F823 is a false positive in nested async
"app/handlers/messages.py" = ["F823"]
# config.py uses print() for fatal startup errors before logging is configured
"app/config.py" = ["T201"]
# Root-level one-off debug scripts (not part of the production or test suite).
# They use print() by design for interactive REPL-style output.
"test_*.py" = ["T201", "E402"]
"scripts/**" = ["T201"]
# Perf benchmark scripts use print() and have loose import structure by design
"artifacts/perf/**" = ["T201", "I001", "F841", "F821", "F541"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── Mypy ───────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.14"
explicit_package_bases = true
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
warn_unreachable = true
show_error_codes = true
# Not yet strict — tighten as codebase matures
disallow_untyped_defs = false
disable_error_code = ["no-any-return", "import-untyped"]

[[tool.mypy.overrides]]
# Telegram handler modules: suppress union-attr / has-type noise
# from python-telegram-bot's pervasive Optional[…] types
module = [
    "app.handlers.*",
]
disable_error_code = ["union-attr", "has-type", "index", "arg-type"]

